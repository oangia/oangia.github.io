<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Oangia Widgets</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            font-family: Roboto, Arial, sans-serif;
            pointer-events: none;
        }

        #floating-widgets-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
            z-index: 999999;
            pointer-events: auto;
        }

        .widget-float-btn {
            width: 52px;
            height: 52px;
            background-color: #059669;
            color: #fff;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .25);
            cursor: pointer;
            transition: transform .2s cubic-bezier(.4, 0, .2, 1);
        }
        .widget-float-btn:hover {
            transform: scale(1.08);
        }
        .widget-float-btn.explorer-btn {
            background-color: #4f46e5;
        }
        .widget-float-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .widget-popup {
            position: absolute;
            right: 0;
            bottom: 68px;
            width: 400px;
            height: 550px;
            max-height: 80vh;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, .2);
            border: 1px solid #e2e8f0;
            display: none;
            flex-direction: column;
            overflow: hidden;
            pointer-events: auto;
        }
        .widget-popup.flex {
            display: flex;
        }
        .widget-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="floating-widgets-container">
        <!-- 1. Storage Explorer Button -->
        <button type="button" class="widget-float-btn explorer-btn" id="explorer-btn" title="Open Storage Explorer">
            <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
        </button>

        <!-- 2. Tracker Button & Popup -->
        <div style="position: relative;">
            <button type="button" class="widget-float-btn" id="tracker-btn" title="Toggle Daily Task Tracker">
                <svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
            </button>
            <div class="widget-popup" id="tracker-popup">
                <iframe class="widget-iframe" src="https://oangia.github.io/tracker.html"></iframe>
            </div>
        </div>
    </div>

    <script>
        const TRACKER_URL = "https://oangia.github.io/tracker.html";
        const EXPLORER_URL = "https://oangia.github.io";

        const trackerBtn = document.getElementById('tracker-btn');
        const trackerPopup = document.getElementById('tracker-popup');
        const explorerBtn = document.getElementById('explorer-btn');

        // Toggle Tracker Popup
        trackerBtn.addEventListener('click', () => {
            trackerPopup.classList.toggle('flex');
            const isOpen = trackerPopup.classList.contains('flex');
            window.parent.postMessage({ action: 'resize', expanded: isOpen }, '*');
        });

        // Open Storage Explorer via message to parent window
        explorerBtn.addEventListener('click', () => {
            window.parent.postMessage({ action: 'openExplorer' }, '*');
        });

        // Handle Keyboard Shortcuts (Ctrl+Shift+Z or Escape) coming from the main page
        window.addEventListener('message', (event) => {
            if (!event.data) return;
            if (event.data.action === 'toggleTrackerModal') {
                trackerPopup.classList.toggle('flex');
                window.parent.postMessage({ action: 'resize', expanded: trackerPopup.classList.contains('flex') }, '*');
            }
        });
    </script>
</body>
</html>
