<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase Notes Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <div class="bg-amber-500 p-2 rounded-xl shadow-md text-slate-900">
          <i class="fa-solid fa-note-sticky text-lg"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight">Firebase Notes Manager</h1>
          <p class="text-[11px] text-slate-400">Modular CRUD with Generic Firebase Service</p>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <span id="statusBadge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/30">
          <span class="w-2 h-2 rounded-full bg-amber-400"></span>
          <span>Local / Demo</span>
        </span>

        <button id="toggleConfigBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-xl text-xs transition flex items-center gap-2 border border-slate-700">
          <i class="fa-solid fa-gear"></i>
          <span>Firebase Config</span>
        </button>
      </div>
    </div>
  </header>

  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm pointer-events-none"></div>

  <main class="max-w-7xl mx-auto px-4 py-6 w-full flex-1 flex flex-col space-y-4">
    <!-- Toolbar -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap gap-4 justify-between items-center">
      <div class="flex items-center gap-2">
        <a href="file.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-2 rounded-xl text-xs transition flex items-center gap-2">
          <i class="fa-solid fa-folder-tree"></i> File Manager
        </a>
      </div>

      <div class="flex items-center gap-2">
        <button id="openCreateModalBtn" class="bg-slate-900 hover:bg-slate-800 text-white font-semibold px-4 py-2 rounded-xl text-xs transition flex items-center gap-2 shadow-sm">
          <i class="fa-solid fa-plus text-amber-400"></i> New Note
        </button>
        <button id="backupDataBtn" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 font-semibold px-3 py-2 rounded-xl text-xs transition flex items-center gap-2">
          <i class="fa-solid fa-file-arrow-down"></i> Backup Notes
        </button>
      </div>
    </div>

    <!-- NOTES TABLE CONTAINER -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex-1 flex flex-col">
      <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
        <h3 class="font-bold text-sm text-slate-700">Text Notes & Posts</h3>
        <span id="notesCount" class="text-xs bg-amber-100 text-amber-800 font-bold px-2.5 py-1 rounded-xl">0 notes</span>
      </div>
      <div class="overflow-x-auto flex-1">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 text-xs uppercase font-semibold">
              <th class="py-3 px-4">Title</th>
              <th class="py-3 px-4">Category</th>
              <th class="py-3 px-4">Content</th>
              <th class="py-3 px-4">Date</th>
              <th class="py-3 px-4 text-center">Actions</th>
            </tr>
          </thead>
          <tbody id="notesTableBody" class="divide-y divide-slate-100 text-sm">
            <tr><td colspan="5" class="py-10 text-center text-slate-400">Loading notes...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- MODAL: CREATE / EDIT NOTE -->
  <div id="createNoteModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-lg w-full shadow-2xl p-6 space-y-4">
      <div class="flex justify-between items-center pb-2 border-b border-slate-100">
        <h3 id="modalTitleText" class="font-bold text-base text-slate-800 flex items-center gap-2"><i class="fa-solid fa-plus text-amber-500"></i> New Note</h3>
        <button id="closeNoteModalBtn" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form id="createNoteForm" class="space-y-4">
        <input type="hidden" id="editNoteId">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Title *</label>
          <input type="text" id="noteTitle" placeholder="Note title..." required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Category</label>
          <select id="noteCategory" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
            <option value="General">General</option>
            <option value="Work">Work</option>
            <option value="Personal">Personal</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Content *</label>
          <textarea id="noteContent" rows="5" placeholder="Note content..." required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm custom-scrollbar"></textarea>
        </div>
        <div class="flex gap-3 justify-end pt-2">
          <button type="button" id="cancelNoteBtn" class="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl text-xs font-semibold">Cancel</button>
          <button type="submit" id="submitNoteBtn" class="px-5 py-2 bg-amber-500 text-slate-950 rounded-xl text-xs font-bold">Save Note</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { FirebaseService } from "./firebase-service.js";
    import { ConfigManager } from "./config-manager.js";

    const fbService = new FirebaseService();
  
    // Initialize the manager by pointing it to your button selector
    const configManager = new ConfigManager({
      buttonSelector: "#toggleConfigBtn", // The button in your header
      fbService: fbService,
      onConnect: (isLive) => {
        renderStatus(isLive);
        loadCurrentFolder(); // Refresh your page data
      },
      onDemo: () => {
        renderStatus(false);
        startLocalDemo(); // Fallback to local demo mode
      }
    });
    
    let currentNotes = [];

    function showToast(msg, type = "info") {
      const container = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      const bgColors = { success: "bg-emerald-600", error: "bg-red-600", info: "bg-slate-900" };
      toast.className = `flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg text-xs font-medium text-white ${bgColors[type]} transition-all transform translate-y-2 opacity-0 pointer-events-auto`;
      toast.innerHTML = `<i class="fa-solid fa-circle-info text-base"></i> <span>${msg}</span>`;
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.remove("translate-y-2", "opacity-0"));
      setTimeout(() => { toast.classList.add("opacity-0", "translate-y-2"); setTimeout(() => toast.remove(), 300); }, 3000);
    }

    function renderStatus(isCloud, err = null) {
      const badge = document.getElementById("statusBadge");
      if (isCloud) {
        badge.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> Live Cloud`;
      } else {
        badge.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/30";
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400"></span> Local Demo`;
      }
      if (err) showToast(err, "error");
    }

    function renderNotes(notes) {
      currentNotes = notes;
      const tbody = document.getElementById("notesTableBody");
      document.getElementById("notesCount").textContent = `${notes.length} notes`;

      if (notes.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-400">No notes found</td></tr>`;
        return;
      }

      tbody.innerHTML = notes.map(n => `
        <tr class="hover:bg-slate-50 transition">
          <td class="py-3 px-4 font-semibold text-slate-800">${escapeHtml(n.title)}</td>
          <td class="py-3 px-4"><span class="px-2 py-0.5 rounded text-[10px] uppercase font-bold bg-slate-100 text-slate-600">${n.category || 'General'}</span></td>
          <td class="py-3 px-4 text-slate-500 truncate max-w-xs">${escapeHtml(n.content)}</td>
          <td class="py-3 px-4 text-xs text-slate-400">${n.formattedDate || 'Recent'}</td>
          <td class="py-3 px-4 text-center">
            <button onclick="window.editNote('${n.id}')" class="p-1.5 text-slate-400 hover:text-amber-600 transition" title="Edit"><i class="fa-solid fa-pen"></i></button>
            <button onclick="window.deleteNote('${n.id}')" class="p-1.5 text-slate-400 hover:text-red-600 transition" title="Delete"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
      `).join("");
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // Modal Triggers
    document.getElementById("openCreateModalBtn").addEventListener("click", () => {
      document.getElementById("createNoteForm").reset();
      document.getElementById("editNoteId").value = "";
      document.getElementById("modalTitleText").innerHTML = `<i class="fa-solid fa-plus text-amber-500"></i> New Note`;
      document.getElementById("submitNoteBtn").textContent = "Save Note";
      document.getElementById("createNoteModal").classList.remove("hidden");
    });

    document.getElementById("closeNoteModalBtn").addEventListener("click", () => document.getElementById("createNoteModal").classList.add("hidden"));
    document.getElementById("cancelNoteBtn").addEventListener("click", () => document.getElementById("createNoteModal").classList.add("hidden"));

    // Create or Update Note Submission
    document.getElementById("createNoteForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("editNoteId").value;
      const title = document.getElementById("noteTitle").value.trim();
      const category = document.getElementById("noteCategory").value;
      const content = document.getElementById("noteContent").value.trim();

      if (id) {
        await fbService.update("posts", id, { title, category, content });
        showToast("Note updated successfully!", "success");
      } else {
        await fbService.create("posts", { title, category, content });
        showToast("Note created successfully!", "success");
      }

      document.getElementById("createNoteModal").classList.add("hidden");
    });

    window.editNote = (id) => {
      const note = currentNotes.find(n => n.id === id);
      if (!note) return;
      document.getElementById("editNoteId").value = note.id;
      document.getElementById("noteTitle").value = note.title || "";
      document.getElementById("noteCategory").value = note.category || "General";
      document.getElementById("noteContent").value = note.content || "";
      document.getElementById("modalTitleText").innerHTML = `<i class="fa-solid fa-pen text-amber-500"></i> Edit Note`;
      document.getElementById("submitNoteBtn").textContent = "Update Note";
      document.getElementById("createNoteModal").classList.remove("hidden");
    };

    window.deleteNote = async (id) => {
      if (!confirm("Are you sure you want to delete this note?")) return;
      await fbService.delete("posts", id);
      showToast("Note deleted!", "success");
    };

    // Backup Notes
    document.getElementById("backupDataBtn").addEventListener("click", () => {
      const backupPayload = {
        posts: currentNotes,
        exportedAt: new Date().toISOString()
      };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupPayload, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `firebase_notes_backup_${new Date().toISOString().slice(0, 10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast("Notes backup downloaded!", "success");
    });

    // Config Panel
    document.getElementById("toggleConfigBtn").addEventListener("click", () => document.getElementById("configPanel").classList.toggle("hidden"));
    document.getElementById("closeConfigBtn").addEventListener("click", () => document.getElementById("configPanel").classList.add("hidden"));
    document.getElementById("saveConfigBtn").addEventListener("click", () => {
      const rawText = document.getElementById("configTextarea").value;
      const parsed = fbService.parseConfig(rawText);
      if (!parsed) { showToast("Invalid config syntax", "error"); return; }
      if (document.getElementById("rememberCookie").checked) fbService.setCookie(fbService.cookieName, rawText, 30);
      if (fbService.connect(parsed)) {
        showToast("Connected to Firebase!", "success");
        initSubscription();
      }
      document.getElementById("configPanel").classList.add("hidden");
    });
    document.getElementById("clearCookieBtn").addEventListener("click", () => {
      fbService.eraseCookie(fbService.cookieName);
      document.getElementById("configTextarea").value = "";
      showToast("Cookie cleared", "info");
      startLocalDemo();
    });

    function initSubscription() {
      if (fbService.isLiveMode) {
        fbService.subscribe("posts", (data) => renderNotes(data));
      }
    }

    function startLocalDemo() {
      if (!localStorage.getItem("demo_posts")) {
        localStorage.setItem("demo_posts", JSON.stringify([{ id: "n-1", title: "Welcome Note", content: "This is a sample local note.", category: "General", createdAt: new Date().toISOString() }]));
      }
      currentNotes = fbService.getLocal("posts");
      renderNotes(currentNotes);
    }

    // Startup
    const saved = fbService.getCookie(fbService.cookieName);
    if (saved) {
      document.getElementById("configTextarea").value = saved;
      const parsed = fbService.parseConfig(saved);
      if (parsed && fbService.connect(parsed)) {
        renderStatus(true);
        initSubscription();
      } else {
        renderStatus(false);
        startLocalDemo();
      }
    } else {
      renderStatus(false);
      startLocalDemo();
    }
  </script>
</body>
</html>
