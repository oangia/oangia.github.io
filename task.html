<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasks Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body class="bg-slate-100 min-h-screen flex justify-center">
  <div id="tracker-root" class="w-full max-w-md bg-slate-50 shadow-xl min-h-screen flex flex-col border-x border-slate-200"></div>

  <script>
    const _memoryStorage = new Map();

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    class Tracker {
      static get _TEMPLATES() {
        return {
          wrapperId: e => `tracker-wrapper-${e}`,
          mainCardId: e => `main-card-${e}`,
          panelClass: "w-full flex-grow bg-slate-50 flex flex-col",
          headerClass: "w-full bg-slate-900 text-white px-4 py-2.5 flex flex-wrap justify-between items-center gap-2 shadow-sm sticky top-0 z-10",
          mainClass: "w-full flex-grow overflow-y-auto px-3 py-4",
          mainCardClass: "w-full bg-white rounded-lg border border-slate-200 shadow-sm p-3.5 space-y-4",
          sectionHeaderClass: "flex items-center justify-between pb-1.5 mb-2",
          sectionTitleClass: "text-[10px] font-bold uppercase tracking-wider text-slate-400",
          sectionCountClass: "text-[10px] font-medium text-slate-400",
          listClass: "space-y-1.5",
          listItemClass: e => "flex items-start justify-between p-2 rounded-md border transition " + (e ? "opacity-50 bg-slate-50 border-slate-100 cursor-not-allowed" : "bg-white border-slate-200/80 hover:border-slate-300 hover:bg-slate-50 cursor-pointer"),
          badgeClass: e => `text-[11px] font-medium px-2.5 py-1 rounded-full border transition-colors duration-300 ${e}`,
          sortOption: (e, t) => `<option value="${e.value}" ${t ? "selected" : ""}>Sort: ${e.label}</option>`,
          header: (e, t, s, a) => `
            <div class="flex items-center gap-2">
              <div class="w-7 h-7 rounded-md bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
                <i class="fa-solid fa-list-check text-xs"></i>
              </div>
              <div>
                <h1 class="text-xs font-bold tracking-tight">${escapeHtml(e)}</h1>
                <p class="text-[10px] text-slate-400">${t}</p>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <select id="sort-select-${a}" class="text-[11px] font-medium bg-slate-800 text-slate-200 border border-slate-700 rounded-md px-2 py-1 outline-none cursor-pointer hover:bg-slate-700 transition">
                ${s}
              </select>
              <button type="button" id="page-info-open-${a}" aria-haspopup="dialog" aria-controls="page-info-dialog-${a}" class="text-[11px] font-medium text-slate-200 bg-slate-800 border border-slate-700 rounded-md px-2 py-1 hover:bg-slate-700 transition">
                <i class="fa-solid fa-circle-info mr-1" aria-hidden="true"></i>About
              </button>
              <div id="progress-badge-${a}" class="text-[11px] font-medium px-2.5 py-1 rounded-full bg-slate-800 text-slate-300 border border-slate-700">
                0 / 0 Completed
              </div>
            </div>`,
          taskItem: (e, t, s, a, r, i, l, n) => `
            <div class="flex items-start gap-2.5 w-full">
              <label for="${e}" class="relative flex items-start gap-2.5 w-full ${r ? "cursor-not-allowed" : "cursor-pointer"}">
                <input type="checkbox" id="${e}" data-task="${escapeHtml(t)}" data-type="${s}" ${r ? "disabled" : ""} ${n ? 'checked data-always-checked="true"' : ""} class="sr-only peer">

                <div class="mt-0.5 w-3.5 h-3.5 rounded border ${i.border} bg-white ${i.bg} peer-checked:border-transparent flex items-center justify-center transition flex-shrink-0 ${r ? "opacity-50" : ""}">
                  <svg class="w-2.5 h-2.5 text-white ${n ? "opacity-100" : "opacity-0"} transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" d="M5 13l4 4L19 7"></path>
                  </svg>
                </div>

                <div class="flex flex-col flex-grow min-w-0">
                  <span class="text-xs font-medium select-none flex items-center flex-wrap gap-1 ${r ? "text-slate-400 line-through" : "text-slate-800"}">
                    <span class="break-words">${escapeHtml(t)}</span>
                    <span class="text-[9px] px-1.5 py-0.2 rounded font-semibold bg-slate-100 text-slate-600 border border-slate-200">${escapeHtml(l)}</span>
                    ${"weekly" === s ? `<span class="text-[9px] px-1 py-0.2 rounded no-underline font-semibold ${i.badge}">Weekly</span>` : ""}
                    ${r ? '<span class="text-[9px] text-slate-500 bg-slate-200 px-1 py-0.2 rounded no-underline font-normal">Disabled</span>' : ""}
                  </span>
                  ${a ? `<span class="text-[10px] text-slate-400 mt-0.5 break-words leading-tight">${escapeHtml(a)}</span>` : ""}
                </div>
              </label>
            </div>`
        };
      }

      constructor(containerId, t = null, s = "Tasks Tracker", a = {}) {
        this.containerId = containerId;
        this.id = a.id || Math.random().toString(36).substring(2, 9);
        this.title = s;
        this.pageDescription = a.pageDescription || "Use this page to keep track of your daily tasks. Check a task when it is complete. Use the sort menu to organize tasks by timeline, priority, section, or objective. The progress counter shows completed tasks; disabled tasks are excluded.";
        this.storageKey = a.storageKey || "daily_tasks_status";
        this.tasks = t || [
          { name: "Learn songs", type: "daily", desc: "Learn as much as possible", priority: 0, timeline: 3, section: "Music", objective: "useful" },
          { name: "Practice singing", type: "daily", priority: 1, timeline: 1, section: "Music", objective: "useful" },
          { name: "Reading", type: "daily", desc: "Try to understand how girls, social, the world work", priority: 2, timeline: 2, section: "Foundation", objective: "useful" },
          { name: "Social", type: "daily", desc: "Be less annoying", priority: 4, timeline: 3, section: "Foundation", objective: "useful", alwaysChecked: true },
          { name: "Exercise", type: "daily", priority: 4, timeline: 0, section: "Foundation", objective: "healthy", disable: true }
        ];
        this.options = {
          defaultSort: a.defaultSort || "timeline",
          sortOptions: a.sortOptions || [
            { value: "timeline", label: "Timeline (Default)" },
            { value: "priority", label: "Priority" },
            { value: "section", label: "Section" },
            { value: "objective", label: "Objective" }
          ],
          ...a
        };
        this.currentSort = this.options.defaultSort;
        this.objectiveColors = {
          healthy: { border: "border-emerald-500", bg: "peer-checked:bg-emerald-600", badge: "text-emerald-700 bg-emerald-50 border border-emerald-200" },
          useful: { border: "border-sky-500", bg: "peer-checked:bg-sky-600", badge: "text-sky-700 bg-sky-50 border border-sky-200" },
          default: { border: "border-slate-400", bg: "peer-checked:bg-slate-600", badge: "text-slate-700 bg-slate-100 border border-slate-200" }
        };
        this.init();
      }

      _getParentStorage() {
        try {
          if (window.parent && window.parent !== window && window.parent.localStorage) {
            return window.parent.localStorage;
          }
        } catch (_) {}
        return null;
      }

      _readStorage(key) {
        try {
          const v = window.localStorage.getItem(key);
          if (v !== null) return v;
        } catch (_) {}

        const parentLs = this._getParentStorage();
        if (parentLs) {
          try {
            const v = parentLs.getItem(`iframe_${key}`);
            if (v !== null) return v;
          } catch (_) {}
        }

        try {
          if (window.name && window.name.startsWith("__TRACKER_STATE__:")) {
            const parsed = JSON.parse(window.name.slice("__TRACKER_STATE__:".length));
            if (parsed && parsed[key] !== undefined) return parsed[key];
          }
        } catch (_) {}

        return _memoryStorage.get(key) ?? null;
      }

      _writeStorage(key, value) {
        _memoryStorage.set(key, value);

        try {
          window.localStorage.setItem(key, value);
        } catch (_) {}

        const parentLs = this._getParentStorage();
        if (parentLs) {
          try {
            parentLs.setItem(`iframe_${key}`, value);
          } catch (_) {}
        }

        try {
          let bag = {};
          if (window.name && window.name.startsWith("__TRACKER_STATE__:")) {
            bag = JSON.parse(window.name.slice("__TRACKER_STATE__:".length)) || {};
          }
          bag[key] = value;
          window.name = "__TRACKER_STATE__:" + JSON.stringify(bag);
        } catch (_) {}
      }

      init() {
        "loading" === document.readyState
          ? document.addEventListener("DOMContentLoaded", () => this.setup())
          : this.setup();
      }

      setup() {
        this.createPanel();
        this.loadState();
        this.attachEvents();
      }

      createPanel() {
        const container = document.getElementById(this.containerId) || document.body;
        this.wrapper && this.wrapper.remove();
        this.wrapper = document.createElement("div");
        this.wrapper.id = Tracker._TEMPLATES.wrapperId(this.id);
        this.wrapper.className = "flex flex-col flex-grow w-full";

        this.panel = document.createElement("div");
        this.panel.className = Tracker._TEMPLATES.panelClass;

        const e = document.createElement("header");
        e.className = Tracker._TEMPLATES.headerClass;
        const t = (new Date).toLocaleDateString(void 0, { weekday: "short", month: "short", day: "numeric" });
        const s = this.options.sortOptions.map(e => Tracker._TEMPLATES.sortOption(e, this.currentSort === e.value)).join("");
        e.innerHTML = Tracker._TEMPLATES.header(this.title, t, s, this.id);
        const infoDialog = document.createElement("dialog");
        infoDialog.id = `page-info-dialog-${this.id}`;
        infoDialog.className = "m-auto w-[calc(100%-2rem)] max-w-md rounded-xl bg-white p-0 text-slate-800 shadow-2xl backdrop:bg-slate-950/60";
        infoDialog.setAttribute("aria-labelledby", `page-info-title-${this.id}`);

        const dialogContent = document.createElement("div");
        dialogContent.className = "p-5";
        dialogContent.innerHTML = `
          <div class="flex items-start justify-between gap-4 mb-3">
            <h2 id="page-info-title-${this.id}" class="text-base font-bold">About this page</h2>
            <button type="button" aria-label="Close page information" class="text-slate-400 hover:text-slate-700 p-1 rounded transition">
              <i class="fa-solid fa-xmark" aria-hidden="true"></i>
            </button>
          </div>
          <p class="text-sm text-slate-600 leading-relaxed whitespace-pre-line"></p>`;
        dialogContent.querySelector("p").textContent = this.pageDescription;
        infoDialog.appendChild(dialogContent);

        const a = document.createElement("main");
        a.className = Tracker._TEMPLATES.mainClass;

        const r = document.createElement("section");
        r.className = Tracker._TEMPLATES.mainCardClass;
        r.id = Tracker._TEMPLATES.mainCardId(this.id);
        this.renderTaskListContainer(r);

        a.appendChild(r);
        this.panel.appendChild(e);
        this.panel.appendChild(a);
        this.wrapper.appendChild(this.panel);
        this.wrapper.appendChild(infoDialog);
        container.appendChild(this.wrapper);

        e.querySelector(`#page-info-open-${this.id}`).addEventListener("click", () => infoDialog.showModal());
        dialogContent.querySelector("button").addEventListener("click", () => infoDialog.close());
        infoDialog.addEventListener("click", event => {
          if (event.target === infoDialog) infoDialog.close();
        });

        e.querySelector(`#sort-select-${this.id}`).addEventListener("change", e => {
          this.currentSort = e.target.value;
          const t = this.captureCurrentCheckStates();
          r.innerHTML = "";
          this.renderTaskListContainer(r);
          this.restoreCheckStates(t);
          this.attachEvents();
        });
      }

      renderTaskListContainer(e) {
        let t = [...this.tasks];
        if ("timeline" === this.currentSort) {
          t.sort((e, t) => (e.timeline ?? 99) - (t.timeline ?? 99));
        } else if ("priority" === this.currentSort) {
          t.sort((e, t) => (e.priority ?? 99) - (t.priority ?? 99));
        } else if ("section" === this.currentSort) {
          t.sort((e, t) => (e.section || "").localeCompare(t.section || ""));
        } else if ("objective" === this.currentSort) {
          const e = { useful: 1, healthy: 2, fun: 3 };
          t.sort((t, s) => (e[t.objective] || 99) - (e[s.objective] || 99));
        }

        const s = document.createElement("div");
        const a = document.createElement("div");
        a.className = Tracker._TEMPLATES.sectionHeaderClass;

        const r = document.createElement("h2");
        r.className = Tracker._TEMPLATES.sectionTitleClass;
        r.textContent = `Sorted by ${this.currentSort}`;

        const i = document.createElement("span");
        i.className = Tracker._TEMPLATES.sectionCountClass;
        i.textContent = `${t.length} ${1 === t.length ? "task" : "tasks"}`;

        a.appendChild(r);
        a.appendChild(i);
        s.appendChild(a);

        const l = document.createElement("ul");
        l.className = Tracker._TEMPLATES.listClass;
        t.forEach((e, t) => {
          const isDisabled = !!(e.disabled || e.disable);
          l.appendChild(this.createTaskListItem(
            e.name,
            e.type || "daily",
            e.desc || "",
            isDisabled,
            e.objective || "default",
            e.section || "General",
            t,
            !!e.alwaysChecked
          ));
        });

        s.appendChild(l);
        e.appendChild(s);
      }

      createTaskListItem(e, t, s, a, r, i, l, n = !1) {
        const o = this.objectiveColors[r] || this.objectiveColors.default;
        const d = `task-${this.id}-${l}`;
        const c = document.createElement("li");
        c.className = Tracker._TEMPLATES.listItemClass(a);
        c.innerHTML = Tracker._TEMPLATES.taskItem(d, e, t, s, a, o, i, n);

        const p = c.querySelector('input[type="checkbox"]');
        const h = c.querySelector("svg");
        p.addEventListener("change", () => {
          n && (p.checked = !0);
          h.classList.toggle("opacity-0", !p.checked);
          h.classList.toggle("opacity-100", p.checked);
        });
        return c;
      }

      captureCurrentCheckStates() {
        const e = {};
        this.panel.querySelectorAll('input[type="checkbox"]:not([disabled])').forEach(t => {
          e[t.dataset.task] = t.checked || "true" === t.dataset.alwaysChecked;
        });
        return e;
      }

      restoreCheckStates(e) {
        this.panel.querySelectorAll('input[type="checkbox"]:not([disabled])').forEach(t => {
          if (e[t.dataset.task] || "true" === t.dataset.alwaysChecked) {
            t.checked = !0;
            const e = t.parentElement.querySelector("svg");
            e && (e.classList.remove("opacity-0"), e.classList.add("opacity-100"));
          }
        });
      }

      updateProgress() {
        const e = Array.from(this.panel.querySelectorAll('input[type="checkbox"]:not([disabled])'));
        const t = e.length;
        const s = e.filter(e => e.checked).length;
        const a = document.getElementById(`progress-badge-${this.id}`);
        if (a) {
          a.textContent = `${s} / ${t} Completed`;
          const e = t > 0 ? s / t : 0;
          let r = "bg-slate-800 text-slate-300 border-slate-700";
          1 === e && t > 0
            ? (r = "bg-emerald-500/20 text-emerald-300 border-emerald-500/40")
            : e >= .75
              ? (r = "bg-sky-500/20 text-sky-300 border-sky-500/40")
              : e >= .4
                ? (r = "bg-amber-500/20 text-amber-300 border-amber-500/40")
                : s > 0 && (r = "bg-rose-500/20 text-rose-300 border-rose-500/40");
          a.className = Tracker._TEMPLATES.badgeClass(r);
        }
      }

      attachEvents() {
        this.panel.querySelectorAll('input[type="checkbox"]:not([disabled])').forEach(e => {
          if (e.dataset.bound === "1") return;
          e.dataset.bound = "1";
          e.addEventListener("change", () => {
            this.saveState();
            this.updateProgress();
          });
        });
        this.updateProgress();
      }

      getTodayDateString() {
        const e = new Date;
        return `${e.getFullYear()}-${e.getMonth() + 1}-${e.getDate()}`;
      }

      getWeekKey() {
        const e = new Date;
        e.setHours(0, 0, 0, 0);
        e.setDate(e.getDate() + 4 - (e.getDay() || 7));
        const t = new Date(e.getFullYear(), 0, 1);
        const s = Math.ceil(((e - t) / 864e5 + 1) / 7);
        return `${e.getFullYear()}-W${s}`;
      }

      saveState() {
        const e = this.panel.querySelectorAll('input[type="checkbox"]:not([disabled])');
        let t = {};
        const s = this._readStorage(this.storageKey);
        if (s) try { t = JSON.parse(s); } catch (e) {}
        const a = this.getTodayDateString();
        const r = this.getWeekKey();
        const i = t.dailyDate === a && t.dailyTasks || {};
        const l = t.weekKey === r && t.weeklyTasks || {};
        e.forEach(e => {
          "weekly" === e.dataset.type ? (l[e.dataset.task] = e.checked) : (i[e.dataset.task] = e.checked);
        });
        this._writeStorage(this.storageKey, JSON.stringify({
          dailyDate: a,
          weekKey: r,
          dailyTasks: i,
          weeklyTasks: l
        }));
      }

      loadState() {
        const e = this._readStorage(this.storageKey);
        const t = this.panel.querySelectorAll('input[type="checkbox"]:not([disabled])');
        if (e) {
          try {
            const s = JSON.parse(e);
            const a = this.getTodayDateString();
            const r = this.getWeekKey();
            t.forEach(e => {
              const t = e.dataset.task;
              const i = e.parentElement.querySelector("svg");
              "true" === e.dataset.alwaysChecked
                ? (e.checked = !0)
                : "weekly" === e.dataset.type
                  ? s.weekKey === r && s.weeklyTasks?.[t] && (e.checked = !0)
                  : s.dailyDate === a && s.dailyTasks?.[t] && (e.checked = !0);
              e.checked && i && (i.classList.remove("opacity-0"), i.classList.add("opacity-100"));
            });
          } catch (e) {
            console.error("Failed to parse task state:", e);
          }
        } else {
          t.forEach(e => {
            if ("true" === e.dataset.alwaysChecked) {
              e.checked = !0;
              const t = e.parentElement.querySelector("svg");
              t && (t.classList.remove("opacity-0"), t.classList.add("opacity-100"));
            }
          });
        }
      }
    }

    window.currentTrackerInstance = new Tracker("tracker-root", [
      { name: "Learn songs", type: "daily", desc: "Learn as much as possible", priority: 0, timeline: 0, section: "Music", objective: "useful" },
      { name: "Practice singing", type: "daily", priority: 1, timeline: 1, section: "Music", objective: "useful" },
      { name: "Exercise", type: "daily", priority: 2, timeline: 2, section: "Foundation", objective: "healthy"},
      { name: "Reading", type: "daily", desc: "Learning: Try to understand how girls, social, the world and yourself work", priority: 3, timeline: 3, section: "Foundation", objective: "useful", alwaysChecked: true },
      { name: "Social", type: "daily", desc: "Be less annoying", priority: 4, timeline: 4, section: "Foundation", objective: "useful", alwaysChecked: true}
    ]);
  </script>
</body>
</html>
