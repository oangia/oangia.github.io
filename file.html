<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Manager App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4 w-full">
      <div class="flex items-center space-x-3">
        <div class="bg-blue-500 p-2 rounded-xl shadow-md text-white">
          <i class="fa-solid fa-folder-tree text-lg"></i>
        </div>
        <div>
          <h1 id="appTitle" class="text-lg font-bold tracking-tight">File Manager - Home</h1>
          <p class="text-[11px] text-slate-400">Fast On-Demand Loading & Chunked Storage</p>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <span id="statusBadge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/30">
          <span class="w-2 h-2 rounded-full bg-amber-400"></span>
          <span>Status</span>
        </span>

        <button id="toggleConfigBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-xl text-xs transition flex items-center gap-2 border border-slate-700">
          <i class="fa-solid fa-gear"></i>
          <span>Config</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Workspace Layout -->
  <div class="flex-1 flex overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-800 text-slate-300 border-r border-slate-700 flex flex-col shrink-0">
      <div class="p-4 border-b border-slate-700 text-xs font-semibold tracking-wider text-slate-400 uppercase">
        Navigation
      </div>
      <nav class="p-3 space-y-1 flex-1">
        <button id="navHome" class="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition bg-blue-600 text-white">
          <i class="fa-solid fa-house text-base"></i>
          <span>Home</span>
        </button>
        <button id="navMemo" class="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition text-slate-300 hover:bg-slate-700 hover:text-white">
          <i class="fa-solid fa-note-sticky text-base"></i>
          <span>Memo</span>
        </button>
        <button id="navJav" class="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition text-slate-300 hover:bg-slate-700 hover:text-white">
          <i class="fa-solid fa-video text-base"></i>
          <span>Jav</span>
        </button>
      </nav>
    </aside>

    <!-- Content Area Container -->
    <main class="flex-1 flex flex-col bg-slate-50 p-4 overflow-y-auto custom-scrollbar">
      <div id="fileManagerApp" class="w-full h-full flex flex-col"></div>
    </main>
  </div>

  <script type="module">
    import { FirebaseService } from "./js/firebase-service.js";
    import { ConfigManager } from "./js/config-manager.js";
    import { FileManager } from "./js/file/manager.js";
    import { FileBackup } from "./js/file/backup.js";

    const fbService = new FirebaseService();

    const collectionConfigs = {
      home: {
        title: "File Manager - Home",
        filesCollection: "book_files",
        fileChunksCollection: "book_file_chunks"
      },
      memo: {
        title: "File Manager - Memo",
        filesCollection: "memo_files",
        fileChunksCollection: "memo_file_chunks"
      },
      jav: {
        title: "File Manager - Jav",
        filesCollection: "jav_files",
        fileChunksCollection: "jav_file_chunks"
      }
    };

    let activeSpace = "home";

    // Initialize FileManager instance ONCE
    const fileManager = new FileManager({
      containerId: "fileManagerApp",
      fbService: fbService,
      filesCollection: collectionConfigs.home.filesCollection,
      fileChunksCollection: collectionConfigs.home.fileChunksCollection
    });
    fileManager.init();

    // Expose globally so inline HTML handlers work properly
    window.fileManager = fileManager;

    function switchSpace(spaceKey) {
      activeSpace = spaceKey;
      const config = collectionConfigs[spaceKey];

      // Update Header Title
      document.getElementById("appTitle").textContent = config.title;

      // Update Sidebar Button Styles
      const buttons = {
        home: document.getElementById("navHome"),
        memo: document.getElementById("navMemo"),
        jav: document.getElementById("navJav")
      };

      Object.keys(buttons).forEach((key) => {
        if (key === spaceKey) {
          buttons[key].className = "sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition bg-blue-600 text-white";
        } else {
          buttons[key].className = "sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition text-slate-300 hover:bg-slate-700 hover:text-white";
        }
      });

      // Switch collection config and reset path back to root
      fileManager.collections = {
        items: config.filesCollection,
        fileChunks: config.fileChunksCollection
      };
      fileManager.currentFolderId = "root";
      // Reload view with the new collection configuration
      fileManager.loadCurrentFolder();
    }

    // Navigation Listeners
    document.getElementById("navHome").addEventListener("click", () => {
      if (activeSpace !== "home") switchSpace("home");
    });

    document.getElementById("navMemo").addEventListener("click", () => {
      if (activeSpace !== "memo") switchSpace("memo");
    });

    document.getElementById("navJav").addEventListener("click", () => {
      if (activeSpace !== "jav") switchSpace("jav");
    });

    // Config Manager Setup
    const configManager = new ConfigManager({
      buttonSelector: "#toggleConfigBtn",
      fbService: fbService,
      onConnect: () => switchSpace(activeSpace),
      onDemo: () => switchSpace(activeSpace)
    });
    

    class DailyTaskTracker {
      constructor(tasks = ['Exercises', 'Diet']) {
        this.tasks = tasks;
        this.cookieName = 'daily_tasks_status';
        this.init();
      }
    
      init() {
        this.createUI();
        this.loadState();
        this.attachEvents();
      }
    
      createUI() {
        // Floating Checklist Icon Button (Tailwind styled)
        this.floatBtn = document.createElement('div');
        this.floatBtn.className = 'fixed bottom-6 right-6 w-14 h-14 bg-rose-600 hover:bg-rose-700 text-white rounded-full flex items-center justify-center shadow-xl cursor-pointer z-50 transition-all duration-200 hover:scale-105';
        this.floatBtn.innerHTML = `<i class="fa-solid fa-list-check text-xl"></i>`;
    
        // Pop-up Card
        this.popup = document.createElement('div');
        this.popup.className = 'fixed bottom-24 right-6 w-80 bg-white rounded-2xl shadow-2xl border border-slate-200 hidden flex-col z-50 overflow-hidden font-sans';
    
        const header = document.createElement('div');
        header.className = 'bg-slate-900 text-white px-4 py-3 flex justify-between items-center text-xs font-bold';
        header.innerHTML = `
          <span class="flex items-center gap-2"><i class="fa-solid fa-list-check text-rose-500"></i> Daily Tasks</span>
          <span class="task-popup-close cursor-pointer text-slate-400 hover:text-white text-base">&times;</span>
        `;
    
        const list = document.createElement('ul');
        list.className = 'p-4 space-y-3 max-h-72 overflow-y-auto custom-scrollbar';
    
        this.tasks.forEach((task, index) => {
          const li = document.createElement('li');
          li.className = 'flex items-center justify-between p-2 rounded-xl hover:bg-slate-50 transition cursor-pointer';
          li.innerHTML = `
            <div class="flex items-center gap-3">
              <input type="checkbox" id="task-${index}" data-task="${task}" class="w-4 h-4 text-rose-600 rounded border-slate-300 focus:ring-rose-500 cursor-pointer">
              <label for="task-${index}" class="text-xs font-medium text-slate-700 cursor-pointer select-none">${task}</label>
            </div>
          `;
          list.appendChild(li);
        });
    
        this.popup.appendChild(header);
        this.popup.appendChild(list);
    
        document.body.appendChild(this.floatBtn);
        document.body.appendChild(this.popup);
      }
    
      attachEvents() {
        this.floatBtn.addEventListener('click', () => {
          if (this.popup.classList.contains('hidden')) {
            this.popup.classList.remove('hidden');
            this.popup.classList.add('flex');
          } else {
            this.popup.classList.remove('flex');
            this.popup.classList.add('hidden');
          }
        });
    
        this.popup.querySelector('.task-popup-close').addEventListener('click', () => {
          this.popup.classList.remove('flex');
          this.popup.classList.add('hidden');
        });
    
        const checkboxes = this.popup.querySelectorAll('input[type="checkbox"]');
        checkboxes.forEach(chk => {
          chk.addEventListener('change', () => this.saveState());
        });
      }
    
      getTodayDateString() {
        const today = new Date();
        return `${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate()}`;
      }
    
      saveState() {
        const checkboxes = this.popup.querySelectorAll('input[type="checkbox"]');
        const checkedTasks = {};
    
        checkboxes.forEach(chk => {
          checkedTasks[chk.dataset.task] = chk.checked;
        });
    
        const data = {
          date: this.getTodayDateString(),
          tasks: checkedTasks
        };
    
        const expires = new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toUTCString();
        document.cookie = `${this.cookieName}=${encodeURIComponent(JSON.stringify(data))}; expires=${expires}; path=/`;
      }
    
      loadState() {
        const cookieValue = this.getCookie(this.cookieName);
        if (!cookieValue) return;
    
        try {
          const data = JSON.parse(decodeURIComponent(cookieValue));
          const today = this.getTodayDateString();
    
          // If the saved date doesn't match today, it skips restoring, leaving all checkboxes unchecked (auto-reset)
          if (data.date !== today) return;
    
          const checkboxes = this.popup.querySelectorAll('input[type="checkbox"]');
          checkboxes.forEach(chk => {
            const taskName = chk.dataset.task;
            if (data.tasks && data.tasks[taskName]) {
              chk.checked = true;
            }
          });
        } catch (e) {
          console.error('Failed to parse task cookie state:', e);
        }
      }
    
      getCookie(name) {
        const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
        return match ? match[2] : null;
      }
    }
    new DailyTaskTracker(["Learn songs", "Practice singing", "Learn an expression","Exercises", "Diet"]);
  </script>
</body>
</html>
