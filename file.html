<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Manager App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/utils.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">
  <!-- Main Workspace Layout -->
  <div class="flex-1 flex overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-800 text-slate-300 border-r border-slate-700 flex flex-col shrink-0">
      <div class="p-4 border-b border-slate-700 text-xs font-semibold tracking-wider text-slate-400 uppercase">
        Navigation
      </div>
      <nav class="p-3 space-y-1 flex-1">
        <button id="navHome" class="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition bg-blue-600 text-white">
          <i class="fa-solid fa-house text-base"></i>
          <span>Home</span>
        </button>
        <button id="navMemo" class="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition text-slate-300 hover:bg-slate-700 hover:text-white">
          <i class="fa-solid fa-note-sticky text-base"></i>
          <span>Memo</span>
        </button>
        <button id="navJav" class="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition text-slate-300 hover:bg-slate-700 hover:text-white">
          <i class="fa-solid fa-video text-base"></i>
          <span>Jav</span>
        </button>
      </nav>
    </aside>

    <!-- Content Area Container -->
    <main class="flex-1 flex flex-col bg-slate-50 p-4 overflow-y-auto custom-scrollbar">
      <div id="fileManagerApp" class="w-full h-full flex flex-col"></div>
    </main>
  </div>

  <script type="module">
    import { FirebaseService } from "./js/firebase-service.js";
    import { ConfigManager } from "./js/config-manager.js";
    import { FileManager } from "./js/file/manager.js";
    import { FileBackup } from "./js/file/backup.js";
    import { DailyTaskTracker } from "./js/tracker.js";
    const fbService = new FirebaseService();

    const collectionConfigs = {
      home: {
        title: "File Manager - Home",
        filesCollection: "book_files",
        fileChunksCollection: "book_file_chunks"
      },
      memo: {
        title: "File Manager - Memo",
        filesCollection: "memo_files",
        fileChunksCollection: "memo_file_chunks"
      },
      jav: {
        title: "File Manager - Jav",
        filesCollection: "jav_files",
        fileChunksCollection: "jav_file_chunks"
      }
    };

    let activeSpace = "home";

    // Initialize FileManager instance ONCE
    const fileManager = new FileManager({
      containerId: "fileManagerApp",
      fbService: fbService,
      filesCollection: collectionConfigs.home.filesCollection,
      fileChunksCollection: collectionConfigs.home.fileChunksCollection
    });
    fileManager.init();

    // Expose globally so inline HTML handlers work properly
    window.fileManager = fileManager;

    function switchSpace(spaceKey) {
      activeSpace = spaceKey;
      const config = collectionConfigs[spaceKey];

      // Update Header Title
      document.getElementById("appTitle").textContent = config.title;

      // Update Sidebar Button Styles
      const buttons = {
        home: document.getElementById("navHome"),
        memo: document.getElementById("navMemo"),
        jav: document.getElementById("navJav")
      };

      Object.keys(buttons).forEach((key) => {
        if (key === spaceKey) {
          buttons[key].className = "sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition bg-blue-600 text-white";
        } else {
          buttons[key].className = "sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition text-slate-300 hover:bg-slate-700 hover:text-white";
        }
      });

      // Switch collection config and reset path back to root
      fileManager.collections = {
        items: config.filesCollection,
        fileChunks: config.fileChunksCollection
      };
      fileManager.currentFolderId = "root";
      // Reload view with the new collection configuration
      fileManager.loadCurrentFolder();
    }

    // Navigation Listeners
    document.getElementById("navHome").addEventListener("click", () => {
      if (activeSpace !== "home") switchSpace("home");
    });

    document.getElementById("navMemo").addEventListener("click", () => {
      if (activeSpace !== "memo") switchSpace("memo");
    });

    document.getElementById("navJav").addEventListener("click", () => {
      if (activeSpace !== "jav") switchSpace("jav");
    });
    new AppHeader({
      title: "File Manager - Home",
      subtitle: "Fast On-Demand Loading & Chunked Storage",
      icon: "fa-solid fa-folder-tree",
      iconBg: "bg-blue-500 text-white",
      status: { text: "Status", color: "amber" },
      actionButton: { 
        id: "toggleConfigBtn", 
        text: "Config", 
        icon: "fa-solid fa-gear" 
      }
    }).mount();

    // Config Manager Setup
    const configManager = new ConfigManager({
      buttonSelector: "#toggleConfigBtn",
      fbService: fbService,
      onConnect: () => switchSpace(activeSpace),
      onDemo: () => switchSpace(activeSpace)
    });
    
    new DailyTaskTracker(["Learn songs", "Practice singing", "Write a song", "Learn an expression","Exercises", "Diet"]);
    
  </script>
</body>
</html>
