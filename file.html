<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Manager App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4 w-full">
      <div class="flex items-center space-x-3">
        <div class="bg-blue-500 p-2 rounded-xl shadow-md text-white">
          <i class="fa-solid fa-folder-tree text-lg"></i>
        </div>
        <div>
          <h1 id="appTitle" class="text-lg font-bold tracking-tight">File Manager - Memo</h1>
          <p class="text-[11px] text-slate-400">Fast On-Demand Loading & Chunked Storage</p>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <span id="statusBadge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/30">
          <span class="w-2 h-2 rounded-full bg-amber-400"></span>
          <span>Status</span>
        </span>

        <button id="toggleConfigBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-xl text-xs transition flex items-center gap-2 border border-slate-700">
          <i class="fa-solid fa-gear"></i>
          <span>Config</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Workspace Layout -->
  <div class="flex-1 flex overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-800 text-slate-300 border-r border-slate-700 flex flex-col shrink-0">
      <div class="p-4 border-b border-slate-700 text-xs font-semibold tracking-wider text-slate-400 uppercase">
        Navigation
      </div>
      <nav class="p-3 space-y-1 flex-1">
        <button id="navMemo" class="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition bg-blue-600 text-white">
          <i class="fa-solid fa-note-sticky text-base"></i>
          <span>Memo</span>
        </button>
        <button id="navBook" class="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition text-slate-300 hover:bg-slate-700 hover:text-white">
          <i class="fa-solid fa-book text-base"></i>
          <span>Book</span>
        </button>
      </nav>
    </aside>

    <!-- Content Area -->
    <main class="flex-1 flex flex-col bg-slate-50">
      <iframe id="appFrame" class="w-full h-full border-0"></iframe>
    </main>
  </div>

  <script type="module">
    import { FirebaseService } from "./firebase-service.js";
    import { ConfigManager } from "./config-manager.js";
    
    const fbService = new FirebaseService();
    
    const collectionConfigs = {
      memo: {
        title: "File Manager - Memo",
        foldersCollection: "folders",
        filesCollection: "files",
        fileChunksCollection: "file_chunks"
      },
      book: {
        title: "File Manager - Book",
        foldersCollection: "book_folders",
        filesCollection: "book_files",
        fileChunksCollection: "book_file_chunks"
      }
    };
    
    let activeSpace = "memo";
    
    function loadSpaceInFrame(spaceKey) {
      activeSpace = spaceKey;
      const config = collectionConfigs[spaceKey];
    
      // Update Main UI Header
      document.getElementById("appTitle").textContent = config.title;
    
      // Update Navigation UI
      document.getElementById("navMemo").className = spaceKey === "memo" 
        ? "sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition bg-blue-600 text-white"
        : "sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition text-slate-300 hover:bg-slate-700 hover:text-white";
    
      document.getElementById("navBook").className = spaceKey === "book" 
        ? "sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition bg-blue-600 text-white"
        : "sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition text-slate-300 hover:bg-slate-700 hover:text-white";
    
      // Re-inject HTML/JS context cleanly into the iframe
      const iframe = document.getElementById("appFrame");
      
      // Set iframe source or write full document context
      const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
      iframeDoc.open();
      iframeDoc.write(`
        <!DOCTYPE html>
        <html>
          <head>
            <script src="https://cdn.tailwindcss.com"><\/script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"><\/script>
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
          </head>
          <body class="p-4 bg-slate-50 text-slate-800">
            <div id="fileManagerApp"></div>
            <script type="module">
              import { FileManager } from "./file-manager.js";
              
              // Access parent's FirebaseService or initialize locally
              const fbService = window.parent.fbService;
    
              window.fileManager = new FileManager({
                containerId: "fileManagerApp",
                fbService: fbService,
                foldersCollection: "${config.foldersCollection}",
                filesCollection: "${config.filesCollection}",
                fileChunksCollection: "${config.fileChunksCollection}"
              });
    
              window.fileManager.init();
            <\/script>
          </body>
        </html>
      `);
      iframeDoc.close();
    }
    
    // Expose fbService to iframe window
    window.fbService = fbService;
    
    // Sidebar navigation listeners
    document.getElementById("navMemo").addEventListener("click", () => {
      if (activeSpace !== "memo") loadSpaceInFrame("memo");
    });
    
    document.getElementById("navBook").addEventListener("click", () => {
      if (activeSpace !== "book") loadSpaceInFrame("book");
    });
    
    // Force-reload button listener
    document.getElementById("reloadFrameBtn").addEventListener("click", () => {
      loadSpaceInFrame(activeSpace);
    });
    
    // Config Manager Setup
    const configManager = new ConfigManager({
      buttonSelector: "#toggleConfigBtn",
      fbService: fbService,
      onConnect: () => loadSpaceInFrame(activeSpace),
      onDemo: () => loadSpaceInFrame(activeSpace)
    });
    
    // Initial Load
    loadSpaceInFrame("memo");
  </script>
</body>
</html>
