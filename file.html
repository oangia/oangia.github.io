<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <div class="bg-blue-500 p-2 rounded-xl shadow-md text-white">
          <i class="fa-solid fa-folder-tree text-lg"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight">File Manager</h1>
          <p class="text-[11px] text-slate-400">Fast On-Demand Loading & Chunked Storage</p>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <span id="statusBadge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/30">
          <span class="w-2 h-2 rounded-full bg-amber-400"></span>
          <span>Local / Demo</span>
        </span>

        <button id="toggleConfigBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-xl text-xs transition flex items-center gap-2 border border-slate-700">
          <i class="fa-solid fa-gear"></i>
          <span>Config</span>
        </button>
      </div>
    </div>
  </header>

  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm pointer-events-none"></div>

  <!-- Context Menu Popup -->
  <div id="contextMenu" class="hidden fixed z-50 bg-white rounded-xl shadow-xl border border-slate-200 py-1.5 w-40 text-xs font-medium text-slate-700">
    <button id="ctxDownloadBtn" class="w-full text-left px-4 py-2 hover:bg-slate-50 flex items-center gap-2 text-slate-700 hidden"><i class="fa-solid fa-download text-emerald-600"></i> Download</button>
    <button id="ctxDeleteBtn" class="w-full text-left px-4 py-2 hover:bg-red-50 hover:text-red-600 flex items-center gap-2 text-slate-700"><i class="fa-solid fa-trash"></i> Delete</button>
  </div>

  <main class="max-w-7xl mx-auto px-4 py-6 w-full flex-1 flex flex-col space-y-4">
    <!-- Toolbar -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap gap-4 justify-between items-center">
      <div class="flex items-center gap-2"></div>

      <div class="flex items-center gap-2">
        <button id="openFolderModalBtn" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-2 rounded-xl text-xs transition flex items-center gap-2">
          <i class="fa-solid fa-folder-plus text-amber-600"></i> New Folder
        </button>
        <button id="openCreateModalBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-xl text-xs transition flex items-center gap-2 shadow-sm">
          <i class="fa-solid fa-cloud-arrow-up"></i> Upload File
        </button>
        <button id="backupDataBtn" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 font-semibold px-3 py-2 rounded-xl text-xs transition flex items-center gap-2">
          <i class="fa-solid fa-file-arrow-down"></i> Backup All Files
        </button>
      </div>
    </div>

    <!-- FILE MANAGER GRID CONTAINER -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex-1 flex flex-col space-y-4">
      <div class="flex items-center justify-between pb-4 border-b border-slate-100">
        <div id="breadcrumbsBar" class="flex items-center gap-2 text-xs font-semibold text-slate-700"></div>
        <span id="fileCountBadge" class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-lg">0 items</span>
      </div>
      <div id="fileGridContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
    </div>

  </main>

  <!-- MODAL: NEW FOLDER -->
  <div id="createFolderModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-sm w-full shadow-2xl p-6 space-y-4">
      <h3 class="font-bold text-base text-slate-800 flex items-center gap-2"><i class="fa-solid fa-folder-plus text-amber-500"></i> Create Folder</h3>
      <input type="text" id="folderNameInput" placeholder="Folder name..." class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      <div class="flex gap-2 justify-end pt-2">
        <button type="button" id="cancelFolderBtn" class="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl text-xs font-semibold">Cancel</button>
        <button type="button" id="submitFolderBtn" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold">Create</button>
      </div>
    </div>
  </div>

  <!-- MODAL: UPLOAD FILE -->
  <div id="createFileModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-xl w-full shadow-2xl p-6 space-y-4">
      <div class="flex justify-between items-center pb-2 border-b border-slate-100">
        <h3 class="font-bold text-base text-slate-800 flex items-center gap-2"><i class="fa-solid fa-cloud-arrow-up text-blue-500"></i> Upload File</h3>
        <button id="closeFileModalBtn" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form id="createFileForm" class="space-y-4">
        <div class="bg-slate-50 border-2 border-dashed border-slate-300 rounded-xl p-5 text-center">
          <label class="cursor-pointer block">
            <i class="fa-solid fa-file-arrow-up text-blue-500 text-2xl mb-1"></i>
            <p class="text-xs font-semibold text-slate-700">Select Image, Video or Document</p>
            <input type="file" id="chunkFileInput" multiple required class="mt-2 block w-full text-xs text-slate-500 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-blue-50 file:text-blue-700">
          </label>
        </div>
        <div class="pt-2 flex gap-3 justify-end">
          <button type="button" id="cancelFileBtn" class="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl text-xs font-semibold">Cancel</button>
          <button type="submit" id="submitFileBtn" class="px-5 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold">Upload File</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: VIEW FILE PREVIEW -->
  <div id="viewModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-2xl w-full shadow-2xl overflow-hidden">
      <div class="bg-slate-900 text-white p-4 px-6 flex justify-between items-center">
        <h3 id="viewModalTitle" class="font-bold text-base">File Preview</h3>
        <button id="closeViewModalBtn" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="p-6 space-y-4">
        <div id="viewContentContainer" class="bg-slate-50 border border-slate-200 rounded-xl p-5 max-h-[400px] overflow-y-auto flex items-center justify-center">
          <i class="fa-solid fa-spinner fa-spin text-2xl text-blue-500"></i>
        </div>
        <div class="flex justify-between items-center pt-2 border-t border-slate-100">
          <span id="viewDate" class="text-xs text-slate-400"></span>
          <a id="downloadFileBtn" href="#" download="" class="bg-emerald-600 text-white px-4 py-2 rounded-xl text-xs font-bold inline-flex items-center gap-2">
            <i class="fa-solid fa-download"></i> Download
          </a>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { FirebaseService } from "./firebase-service.js";
    import { FirebaseConfigManager } from "./firebase-config-manager.js";

    const fbService = new FirebaseService();
    let currentFolderId = "root";
    let contextTarget = null; // { type: 'folder'|'file', id, fileId }

    // Initialize the reusable Config Manager component
    const configManager = new FirebaseConfigManager({
      buttonSelector: "#toggleConfigBtn",
      fbService: fbService,
      onConnect: (isLive) => {
        renderStatus(isLive);
        loadCurrentFolder();
      },
      onDemo: () => {
        renderStatus(false);
        startLocalDemo();
      }
    });

    function showToast(msg, type = "info") {
      const container = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      const bgColors = { success: "bg-emerald-600", error: "bg-red-600", info: "bg-slate-900" };
      toast.className = `flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg text-xs font-medium text-white ${bgColors[type]} transition-all transform translate-y-2 opacity-0 pointer-events-auto`;
      toast.innerHTML = `<i class="fa-solid fa-circle-info text-base"></i> <span>${msg}</span>`;
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.remove("translate-y-2", "opacity-0"));
      setTimeout(() => { toast.classList.add("opacity-0", "translate-y-2"); setTimeout(() => toast.remove(), 300); }, 3000);
    }

    function renderStatus(isCloud, err = null) {
      const badge = document.getElementById("statusBadge");
      if (isCloud) {
        badge.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> Live Cloud`;
      } else {
        badge.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/30";
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400"></span> Local Demo`;
      }
      if (err) showToast(err, "error");
    }

    // ON-DEMAND LOADING: Fetch only folders and files for the current folder
    async function loadCurrentFolder() {
      const breadcrumbs = document.getElementById("breadcrumbsBar");
      const grid = document.getElementById("fileGridContainer");
      grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 text-xs"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-blue-500 block"></i>Loading folder...</div>`;

      try {
        let subFolders = [];
        let dirFiles = [];
        let currentFolderName = "Home";

        if (fbService.isLiveMode) {
          subFolders = await fbService.getByField("folders", "parentId", currentFolderId);
          dirFiles = await fbService.getByField("files", "folderId", currentFolderId);
          if (currentFolderId !== "root") {
            const parentFolder = await fbService.getById("folders", currentFolderId);
            if (parentFolder) currentFolderName = parentFolder.name;
          }
        } else {
          const allFolders = JSON.parse(localStorage.getItem("demo_folders") || "[]");
          const allFiles = JSON.parse(localStorage.getItem("demo_files") || "[]");
          subFolders = allFolders.filter(f => f.parentId === currentFolderId);
          dirFiles = allFiles.filter(f => f.folderId === currentFolderId);
          if (currentFolderId !== "root") {
            const found = allFolders.find(f => f.id === currentFolderId);
            if (found) currentFolderName = found.name;
          }
        }

        if (currentFolderId === "root") {
          breadcrumbs.innerHTML = `<span class="text-blue-600 font-bold"><i class="fa-solid fa-house"></i> Home</span>`;
        } else {
          breadcrumbs.innerHTML = `
            <button onclick="window.navigateToFolder('root')" class="hover:text-blue-600"><i class="fa-solid fa-house"></i> Home</button>
            <i class="fa-solid fa-chevron-right text-[10px] text-slate-400"></i>
            <span class="text-blue-600 font-bold">${escapeHtml(currentFolderName)}</span>
          `;
        }

        document.getElementById("fileCountBadge").textContent = `${subFolders.length} folders, ${dirFiles.length} files`;

        let html = "";
        subFolders.forEach(folder => {
          html += `
            <div ondblclick="window.navigateToFolder('${folder.id}')" onclick="window.navigateToFolder('${folder.id}')" oncontextmenu="window.openContextMenu(event, 'folder', '${folder.id}')" class="bg-slate-50 hover:bg-blue-50 border border-slate-200 hover:border-blue-300 rounded-2xl p-4 flex flex-col items-center justify-center gap-2 cursor-pointer transition group shadow-sm select-none">
              <i class="fa-solid fa-folder text-amber-400 text-4xl group-hover:scale-110 transition"></i>
              <span class="text-xs font-bold text-slate-700 truncate w-full text-center">${escapeHtml(folder.name)}</span>
            </div>
          `;
        });

        dirFiles.forEach(file => {
          let thumbHtml = `<i class="fa-solid fa-file-lines text-blue-400 text-4xl"></i>`;
          if (file.thumbnail) {
            thumbHtml = `<img src="${file.thumbnail}" class="w-full h-20 object-cover rounded-xl shadow-inner">`;
          } else if (file.category === 'Media') {
            thumbHtml = `<i class="fa-solid fa-file-video text-purple-400 text-4xl"></i>`;
          }

          html += `
            <div onclick="window.viewFile('${file.id}', '${file.fileId}')" oncontextmenu="window.openContextMenu(event, 'file', '${file.id}', '${file.fileId}')" class="bg-white hover:bg-blue-50/50 border border-slate-200 hover:border-blue-300 rounded-2xl p-3 flex flex-col items-center justify-between gap-2 cursor-pointer transition group shadow-sm select-none">
              <div class="w-full flex justify-center items-center h-20 bg-slate-100 rounded-xl overflow-hidden">
                ${thumbHtml}
              </div>
              <span class="text-xs font-semibold text-slate-800 truncate w-full text-center" title="${escapeHtml(file.title)}">${escapeHtml(file.title)}</span>
              <div class="w-full text-center text-[10px] text-slate-400 pt-1 border-t border-slate-100">
                <span>${file.totalParts || 1} chunks</span>
              </div>
            </div>
          `;
        });

        if (subFolders.length === 0 && dirFiles.length === 0) {
          grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 text-xs"><i class="fa-regular fa-folder-open text-3xl mb-2 text-slate-300 block"></i>This folder is empty</div>`;
        } else {
          grid.innerHTML = html;
        }
      } catch (err) {
        showToast(`Error loading folder: ${err.message}`, "error");
      }
    }

    window.navigateToFolder = (folderId) => {
      currentFolderId = folderId;
      loadCurrentFolder();
    };

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // Context Menu Logic
    window.openContextMenu = (e, type, id, fileId = null) => {
      e.preventDefault();
      contextTarget = { type, id, fileId };
      const menu = document.getElementById("contextMenu");
      const downloadBtn = document.getElementById("ctxDownloadBtn");

      if (type === 'file') {
        downloadBtn.classList.remove("hidden");
      } else {
        downloadBtn.classList.add("hidden");
      }

      menu.style.top = `${Math.min(e.clientY, window.innerHeight - 120)}px`;
      menu.style.left = `${Math.min(e.clientX, window.innerWidth - 160)}px`;
      menu.classList.remove("hidden");
    };

    document.addEventListener("click", () => {
      document.getElementById("contextMenu").classList.add("hidden");
    });

    document.getElementById("backupDataBtn").addEventListener("click", async () => {
      showToast("Preparing ZIP backup...", "info");
      try {
        let folders = [], files = [], file_chunks = [];
        if (fbService.isLiveMode) {
          folders = await fbService.getAll("folders");
          files = await fbService.getAll("files");
          file_chunks = await fbService.getAll("file_chunks");
        } else {
          folders = JSON.parse(localStorage.getItem("demo_folders") || "[]");
          files = JSON.parse(localStorage.getItem("demo_files") || "[]");
          file_chunks = JSON.parse(localStorage.getItem("demo_file_chunks") || "[]");
        }
    
        const zip = new JSZip();
    
        const getFolderPath = (folderId) => {
          let pathParts = [];
          let currentId = folderId;
          while (currentId && currentId !== "root") {
            const folder = folders.find(f => f.id === currentId);
            if (folder) {
              pathParts.unshift(folder.name);
              currentId = folder.parentId;
            } else {
              break;
            }
          }
          return pathParts.join("/");
        };
    
        for (const fileRecord of files) {
          const chunks = file_chunks
            .filter(c => c.fileId === fileRecord.fileId)
            .sort((a, b) => a.partIndex - b.partIndex);
          
          const fullBase64 = chunks.map(c => c.chunkData).join("");
          const base64Data = fullBase64.split(',')[1];
          if (!base64Data) continue;
          
          const binaryString = atob(base64Data);
          const bytes = new Uint8Array(binaryString.length);
          for (let i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
          }
    
          const folderPath = getFolderPath(fileRecord.folderId);
          const filePath = folderPath ? `${folderPath}/${fileRecord.title}` : fileRecord.title;
          
          zip.file(filePath, bytes);
        }
    
        const content = await zip.generateAsync({ type: "blob" });
        const downloadAnchor = document.createElement('a');
        downloadAnchor.href = URL.createObjectURL(content);
        downloadAnchor.download = `firebase_file_manager_backup_${new Date().toISOString().slice(0, 10)}.zip`;
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        
        showToast("ZIP backup downloaded successfully!", "success");
      } catch (err) {
        showToast(`Failed to generate ZIP: ${err.message}`, "error");
      }
    });

    document.getElementById("ctxDeleteBtn").addEventListener("click", async () => {
      if (!contextTarget) return;
      if (contextTarget.type === 'folder') {
        if (!confirm("Delete folder?")) return;
        await fbService.delete("folders", contextTarget.id);
        showToast("Folder deleted", "success");
      } else if (contextTarget.type === 'file') {
        if (!confirm("Delete file and its chunks?")) return;
        await fbService.delete("files", contextTarget.id);
        
        const chunks = fbService.isLiveMode ? 
          await fbService.getByField("file_chunks", "fileId", contextTarget.fileId) :
          JSON.parse(localStorage.getItem("demo_file_chunks") || "[]").filter(c => c.fileId === contextTarget.fileId);
        
        for (const chunk of chunks) {
          await fbService.delete("file_chunks", chunk.id);
        }
        showToast("File deleted", "success");
      }
      document.getElementById("contextMenu").classList.add("hidden");
      loadCurrentFolder();
    });

    document.getElementById("ctxDownloadBtn").addEventListener("click", async () => {
      if (!contextTarget || contextTarget.type !== 'file') return;
            
      const fileRecord = fbService.isLiveMode ?
        await fbService.getById("files", contextTarget.id) :
        JSON.parse(localStorage.getItem("demo_files") || "[]").find(f => f.id === contextTarget.id);
      if (!fileRecord) return;
      const chunks = fbService.isLiveMode ?
        await fbService.getByField("file_chunks", "fileId", fileRecord.fileId) :
        JSON.parse(localStorage.getItem("demo_file_chunks") || "[]").filter(c => c.fileId === fileRecord.fileId);
      chunks.sort((a, b) => a.partIndex - b.partIndex);
      const fullBase64 = chunks.map(c => c.chunkData).join("");
      const downloadAnchor = document.createElement('a');
      downloadAnchor.href = fullBase64;
      downloadAnchor.download = fileRecord.title;
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast(`Downloaded ${fileRecord.title}`, "success");
      document.getElementById("contextMenu").classList.add("hidden");
    });

    // Modal Triggers
    document.getElementById("openFolderModalBtn").addEventListener("click", () => {
      document.getElementById("folderNameInput").value = "";
      document.getElementById("createFolderModal").classList.remove("hidden");
    });
    document.getElementById("cancelFolderBtn").addEventListener("click", () => document.getElementById("createFolderModal").classList.add("hidden"));
    
    document.getElementById("submitFolderBtn").addEventListener("click", async () => {
      const name = document.getElementById("folderNameInput").value.trim();
      if (!name) return;
      await fbService.create("folders", { name, parentId: currentFolderId });
      showToast("Folder created!", "success");
      document.getElementById("createFolderModal").classList.add("hidden");
      loadCurrentFolder();
    });

    document.getElementById("openCreateModalBtn").addEventListener("click", () => {
      document.getElementById("createFileForm").reset();
      document.getElementById("createFileModal").classList.remove("hidden");
    });

    document.getElementById("closeFileModalBtn").addEventListener("click", () => document.getElementById("createFileModal").classList.add("hidden"));
    document.getElementById("cancelFileBtn").addEventListener("click", () => document.getElementById("createFileModal").classList.add("hidden"));

    // Chunked File Upload Handler
    document.getElementById("createFileForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById("chunkFileInput");
      const files = fileInput.files;
      if (!files || files.length === 0) return;

      const submitBtn = document.getElementById("submitFileBtn");
      submitBtn.disabled = true;

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Uploading (${i + 1}/${files.length}): ${file.name}`;

        try {
          const base64Data = await readFileAsDataURL(file);
          
          let thumbnail = "";
          if (file.type.startsWith("image/")) {
            thumbnail = await generateThumbnail(base64Data, 150);
          }

          const CHUNK_SIZE = 700000; // ~700KB chunks
          const totalParts = Math.ceil(base64Data.length / CHUNK_SIZE);
          const fileId = "file_" + Date.now() + "_" + i;

          await fbService.create("files", {
            fileId,
            title: file.name,
            category: file.type.startsWith("image/") ? "Image" : "Media",
            folderId: currentFolderId,
            totalParts,
            thumbnail
          });

          for (let c = 0; c < totalParts; c++) {
            const chunkData = base64Data.substring(c * CHUNK_SIZE, (c + 1) * CHUNK_SIZE);
            await fbService.create("file_chunks", {
              fileId,
              partIndex: c,
              chunkData
            });
          }

          showToast(`Uploaded: ${file.name}`, "success");
        } catch (err) {
          showToast(`Failed to upload ${file.name}: ${err.message}`, "error");
        }
      }

      submitBtn.disabled = false;
      submitBtn.textContent = "Upload File";
      document.getElementById("createFileModal").classList.add("hidden");
      loadCurrentFolder();
    });

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.onerror = (err) => reject(err);
        reader.readAsDataURL(file);
      });
    }

    function generateThumbnail(base64Str, maxSize = 150) {
      return new Promise((resolve) => {
        const img = new Image();
        img.src = base64Str;
        img.onload = () => {
          const canvas = document.createElement("canvas");
          let w = img.width, h = img.height;
          if (w > h) { h = Math.round((h * maxSize) / w); w = maxSize; }
          else { w = Math.round((w * maxSize) / h); h = maxSize; }
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", 0.6));
        };
        img.onerror = () => resolve("");
      });
    }

    // View File Reassembly & Preview
    window.viewFile = async (id, fileId) => {
      const fileRecord = fbService.isLiveMode ?
        await fbService.getById("files", id) :
        JSON.parse(localStorage.getItem("demo_files") || "[]").find(f => f.id === id || f.fileId === fileId);

      if (!fileRecord) return;

      document.getElementById("viewModalTitle").textContent = fileRecord.title;
      document.getElementById("viewDate").innerHTML = `<i class="fa-regular fa-clock"></i> Recent`;
      
      const container = document.getElementById("viewContentContainer");
      const downloadBtn = document.getElementById("downloadFileBtn");
      
      container.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-2xl text-blue-500 mb-2"></i><p class="text-xs text-slate-500">Reassembling file chunks...</p>`;
      document.getElementById("viewModal").classList.remove("hidden");

      const chunks = fbService.isLiveMode ?
        await fbService.getByField("file_chunks", "fileId", fileRecord.fileId) :
        JSON.parse(localStorage.getItem("demo_file_chunks") || "[]").filter(c => c.fileId === fileRecord.fileId);

      chunks.sort((a, b) => a.partIndex - b.partIndex);
      const fullBase64 = chunks.map(c => c.chunkData).join("");

      if (fullBase64.startsWith("data:image/")) {
        container.innerHTML = `<img src="${fullBase64}" class="max-h-85 rounded-xl shadow-md object-contain">`;
      } else if (fullBase64.startsWith("data:video/")) {
        container.innerHTML = `<video controls class="w-full max-h-85 rounded-xl shadow-md bg-black"><source src="${fullBase64}"></video>`;
      } else {
        container.innerHTML = `<div class="text-center py-6"><i class="fa-solid fa-file-arrow-down text-4xl text-blue-500 mb-2"></i><p class="text-sm font-semibold">${escapeHtml(fileRecord.title)}</p></div>`;
      }

      downloadBtn.href = fullBase64;
      downloadBtn.download = fileRecord.title;
    };

    document.getElementById("closeViewModalBtn").addEventListener("click", () => {
      document.getElementById("viewContentContainer").innerHTML = "";
      document.getElementById("viewModal").classList.add("hidden");
    });

    function startLocalDemo() {
      if (!localStorage.getItem("demo_folders")) {
        localStorage.setItem("demo_folders", JSON.stringify([{ id: "f-1", name: "Sample Folder", parentId: "root", createdAt: new Date().toISOString() }]));
      }
      if (!localStorage.getItem("demo_files")) localStorage.setItem("demo_files", JSON.stringify([]));
      if (!localStorage.getItem("demo_file_chunks")) localStorage.setItem("demo_file_chunks", JSON.stringify([]));
      loadCurrentFolder();
    }
  </script>
