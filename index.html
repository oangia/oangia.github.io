      </div>
    </div>

    <!-- Center: Search -->

            <i class="fa-solid fa-plus text-indigo-400"></i>

        <div class="flex items-center space-x-2 text-sm text-slate-200">

        </div>
      </div>

        <div id="itemsGrid"></div>
      </div>

      <div id="syncProgressBar" class="h-full bg-sky-400 transition-all duration-200" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" style="width: 0%"></div>

      <span id="syncProgressSummary">In progress</span>
    </div>
  </section>

  }
