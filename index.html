<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Header & Markdown Extractor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/utils.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">
  <main class="max-w-7xl mx-auto px-4 py-6 w-full flex-1 flex flex-col space-y-4">

    <!-- Toolbar -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap gap-4 justify-between items-center">
      <div class="flex items-center flex-wrap gap-2">
        <a href="file.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-2 rounded-xl text-xs transition flex items-center gap-2">
          <i class="fa-solid fa-folder-tree text-blue-500"></i> File Manager
        </a>
        <a href="data.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-2 rounded-xl text-xs transition flex items-center gap-2">
          <i class="fa-solid fa-note-sticky text-amber-500"></i> Notes Manager
        </a>
        <a href="image.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-2 rounded-xl text-xs transition flex items-center gap-2">
          <i class="fa-solid fa-film text-purple-500"></i> Frame Extractor
        </a>
        <a href="pts.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-2 rounded-xl text-xs transition flex items-center gap-2">
          <i class="fa-solid fa-wand-magic-sparkles text-cyan-600"></i> Photoshop
        </a>
      </div>

      <div class="flex items-center flex-wrap gap-3">
        <!-- Mode Selector -->
        <div class="flex items-center bg-slate-100 p-1 rounded-xl text-xs font-semibold border border-slate-200">
          <label id="modeHeadersLabel" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg cursor-pointer transition bg-white text-rose-600 shadow-sm">
            <input type="radio" name="extractMode" value="headers" checked class="hidden">
            <i class="fa-solid fa-heading text-xs"></i>
            <span>Headers Only</span>
          </label>
          <label id="modeMarkdownLabel" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg cursor-pointer transition text-slate-600 hover:text-slate-900">
            <input type="radio" name="extractMode" value="markdown" class="hidden">
            <i class="fa-solid fa-file-lines text-xs"></i>
            <span>Full .MD File</span>
          </label>
        </div>

        <!-- Upload PDF Button -->
        <label class="bg-rose-600 hover:bg-rose-700 text-white font-semibold px-4 py-2 rounded-xl text-xs transition flex items-center gap-2 shadow-sm cursor-pointer">
          <i class="fa-solid fa-cloud-arrow-up"></i>
          <span>Upload PDF</span>
          <input type="file" id="pdfUpload" accept=".pdf" class="hidden">
        </label>
      </div>
    </div>

    <!-- Main Output Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col flex-1">
      
      <!-- Card Header -->
      <div class="bg-slate-50 border-b border-slate-200 px-5 py-3.5 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center flex-wrap gap-2.5">
          <span id="outputLabel" class="text-xs font-bold uppercase tracking-wider text-slate-700 flex items-center gap-2">
            <i class="fa-solid fa-file-code text-rose-500 text-sm"></i>
            <span>Headers Extraction Output</span>
          </span>
          <span id="fileBadge" class="hidden text-xs font-medium px-2.5 py-1 rounded-lg bg-slate-200 text-slate-700 items-center gap-1.5">
            <i class="fa-solid fa-file-pdf text-rose-500"></i>
            <span id="fileNameDisplay"></span>
          </span>
          <span id="pagesBadge" class="hidden text-xs font-medium px-2.5 py-1 rounded-lg bg-rose-50 text-rose-700 border border-rose-200 items-center gap-1">
            <span id="pageCountDisplay"></span>
          </span>
        </div>

        <div class="flex items-center gap-2">
          <button id="copyBtn" onclick="copyOutput()" class="hidden bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-1.5 rounded-xl text-xs transition flex items-center gap-1.5 border border-slate-200">
            <i class="fa-solid fa-copy text-slate-500"></i>
            <span id="copyBtnText">Copy</span>
          </button>
          <button id="downloadBtn" onclick="downloadMd()" class="hidden bg-rose-600 hover:bg-rose-700 text-white font-semibold px-3.5 py-1.5 rounded-xl text-xs transition flex items-center gap-1.5 shadow-sm">
            <i class="fa-solid fa-download"></i>
            <span>Download .md</span>
          </button>
        </div>
      </div>

      <!-- Content Area -->
      <div class="relative flex-1 flex flex-col min-h-[500px]">
        <!-- Empty Drop Zone -->
        <div id="dropZone" class="flex-1 flex flex-col items-center justify-center p-8 text-center bg-slate-50/50 border-2 border-dashed border-slate-200 m-4 rounded-xl cursor-pointer hover:bg-rose-50/20 hover:border-rose-300 transition-all">
          <div class="w-14 h-14 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center text-2xl mb-3 shadow-inner">
            <i class="fa-solid fa-file-pdf"></i>
          </div>
          <h3 class="text-sm font-bold text-slate-800 mb-1">Select a PDF file to begin extraction</h3>
          <p class="text-xs text-slate-500 max-w-sm mb-4">Extract clean Markdown headings, structured lists, and formatted document content right in your browser.</p>
          <button type="button" onclick="document.getElementById('pdfUpload').click()" class="bg-rose-600 hover:bg-rose-700 text-white font-semibold px-4 py-2 rounded-xl text-xs transition flex items-center gap-2 shadow-sm">
            <i class="fa-solid fa-folder-open"></i> Browse PDF
          </button>
        </div>

        <!-- Preformatted Output Display -->
        <pre id="output" class="hidden flex-1 w-full bg-slate-900 text-slate-200 p-5 text-xs font-mono overflow-y-auto whitespace-pre-wrap rounded-b-2xl custom-scrollbar selection:bg-rose-500/30 leading-relaxed"></pre>
      </div>

    </div>

  </main>

  <script>
    // PDF.js worker setup
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    let currentFile = null;

    function showToast(msg, type = "info") {
      const container = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      const bgColors = { success: "bg-emerald-600", error: "bg-red-600", info: "bg-slate-900" };
      toast.className = `flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg text-xs font-medium text-white ${bgColors[type] || bgColors.info} transition-all transform translate-y-2 opacity-0 pointer-events-auto`;
      toast.innerHTML = `<i class="fa-solid fa-circle-info text-base"></i> <span>${msg}</span>`;
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.remove("translate-y-2", "opacity-0"));
      setTimeout(() => {
        toast.classList.add("opacity-0", "translate-y-2");
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function updateModeUI(mode) {
      const labelMarkdown = document.getElementById('modeMarkdownLabel');
      const labelHeaders = document.getElementById('modeHeadersLabel');
      const outputLabel = document.getElementById('outputLabel');

      if (mode === 'markdown') {
        labelMarkdown.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-lg cursor-pointer transition bg-white text-rose-600 shadow-sm';
        labelHeaders.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-lg cursor-pointer transition text-slate-600 hover:text-slate-900';
        outputLabel.innerHTML = '<i class="fa-solid fa-file-code text-rose-500 text-sm"></i> <span>Markdown (.md) Content</span>';
      } else {
        labelHeaders.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-lg cursor-pointer transition bg-white text-rose-600 shadow-sm';
        labelMarkdown.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-lg cursor-pointer transition text-slate-600 hover:text-slate-900';
        outputLabel.innerHTML = '<i class="fa-solid fa-heading text-rose-500 text-sm"></i> <span>Headers Extraction Output</span>';
      }
    }

    document.querySelectorAll('input[name="extractMode"]').forEach(radio => {
      radio.addEventListener('change', () => {
        const mode = document.querySelector('input[name="extractMode"]:checked').value;
        updateModeUI(mode);
        if (currentFile) processPdf(currentFile);
      });
    });

    // Drag and drop handlers on dropZone
    const dropZone = document.getElementById('dropZone');
    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.add('border-rose-400', 'bg-rose-50/40');
      });
    });
    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.remove('border-rose-400', 'bg-rose-50/40');
      });
    });
    dropZone.addEventListener('drop', (e) => {
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        const file = e.dataTransfer.files[0];
        if (file.name.toLowerCase().endsWith('.pdf') || file.type === 'application/pdf') {
          currentFile = file;
          processPdf(file);
        } else {
          showToast('Please select a valid PDF file.', 'error');
        }
      }
    });

    document.getElementById('pdfUpload').addEventListener('change', function(e) {
      if (e.target.files && e.target.files[0]) {
        currentFile = e.target.files[0];
        processPdf(currentFile);
      }
    });

    async function processPdf(file) {
      const output = document.getElementById('output');
      const dropZone = document.getElementById('dropZone');
      const copyBtn = document.getElementById('copyBtn');
      const downloadBtn = document.getElementById('downloadBtn');
      const statusBadge = document.getElementById('statusBadge');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const fileBadge = document.getElementById('fileBadge');
      const fileNameDisplay = document.getElementById('fileNameDisplay');
      const pagesBadge = document.getElementById('pagesBadge');
      const pageCountDisplay = document.getElementById('pageCountDisplay');

      dropZone.classList.add('hidden');
      output.classList.remove('hidden');

      output.textContent = 'Reading file...';
      copyBtn.classList.add('hidden');
      downloadBtn.classList.add('hidden');

      // Status indicator
      statusBadge.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/30';
      statusDot.className = 'w-2 h-2 rounded-full bg-amber-400 animate-ping';
      statusText.textContent = 'Parsing...';

      fileBadge.classList.remove('hidden');
      fileBadge.classList.add('flex');
      fileNameDisplay.textContent = file.name;

      const mode = document.querySelector('input[name="extractMode"]:checked').value;

      try {
        const reader = new FileReader();
        reader.onload = async function() {
          try {
            output.textContent = 'Parsing PDF document structure...';
            const typedarray = new Uint8Array(this.result);
            const pdfDoc = await pdfjsLib.getDocument({ data: typedarray }).promise;

            pagesBadge.classList.remove('hidden');
            pagesBadge.classList.add('flex');
            pageCountDisplay.textContent = `${pdfDoc.numPages} ${pdfDoc.numPages === 1 ? 'Page' : 'Pages'}`;

            if (mode === 'headers') {
              await extractHeadersOnly(pdfDoc);
            } else {
              await extractAsMarkdown(pdfDoc, file.name);
            }

            copyBtn.classList.remove('hidden');
            if (mode === 'markdown') downloadBtn.classList.remove('hidden');

            statusBadge.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
            statusDot.className = 'w-2 h-2 rounded-full bg-emerald-400';
            statusText.textContent = 'Completed';

            showToast(`Extracted ${file.name} successfully!`, 'success');
          } catch (err) {
            output.textContent = 'PDF Processing Error: ' + err.message;
            statusBadge.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-red-500/20 text-red-300 border border-red-500/30';
            statusDot.className = 'w-2 h-2 rounded-full bg-red-400';
            statusText.textContent = 'Error';
            showToast('Failed to process PDF: ' + err.message, 'error');
          }
        };
        reader.onerror = () => {
          output.textContent = 'Failed to read local file.';
          showToast('Failed to read local file.', 'error');
        };
        reader.readAsArrayBuffer(file);

      } catch (error) {
        output.textContent = 'Error: ' + error.message;
        showToast('Error: ' + error.message, 'error');
      }
    }

    async function extractAsMarkdown(pdfDoc, fileName) {
      const output = document.getElementById('output');
      let mdLines = [];

      const documentTitle = fileName.replace(/\.pdf$/i, '');
      mdLines.push(`# ${documentTitle}\n`);

      const outline = await pdfDoc.getOutline().catch(() => null);
      if (outline && outline.length > 0) {
        mdLines.push(`## Table of Contents\n`);
        function processOutline(items, indent = '') {
          for (let item of items) {
            if (item.title) {
              mdLines.push(`${indent}- ${item.title.trim()}`);
            }
            if (item.items && item.items.length > 0) {
              processOutline(item.items, indent + '  ');
            }
          }
        }
        processOutline(outline);
        mdLines.push('\n---\n');
      }

      for (let i = 1; i <= pdfDoc.numPages; i++) {
        output.textContent = `Processing Page ${i} of ${pdfDoc.numPages}...`;
        const page = await pdfDoc.getPage(i);
        const textContent = await page.getTextContent();
        const items = textContent.items;
        const styles = textContent.styles || {};

        if (items.length === 0) continue;

        mdLines.push(`\n## Page ${i}\n`);

        let heights = items.map(item => item.height || Math.abs(item.transform[3]));
        let avgHeight = heights.reduce((a, b) => a + b, 0) / (heights.length || 1);

        let linesMap = {};
        items.forEach(item => {
          if (!item.str || !item.str.trim()) return;
          let y = Math.round(item.transform[5] / 4) * 4;
          if (!linesMap[y]) linesMap[y] = [];
          
          let fontName = item.fontName;
          let fontStyle = styles[fontName] || {};
          let isBold = (fontStyle.name && /bold|black|heavy/i.test(fontStyle.name)) || 
                       (fontName && /bold|black|heavy/i.test(fontName));

          linesMap[y].push({
            str: item.str,
            height: item.height || Math.abs(item.transform[3]),
            isBold: isBold,
            x: item.transform[4]
          });
        });

        let sortedYs = Object.keys(linesMap).map(Number).sort((a, b) => b - a);

        for (let y of sortedYs) {
          let lineItems = linesMap[y].sort((a, b) => a.x - b.x);
          let lineText = lineItems.map(it => it.str).join(' ').trim();
          let maxHeight = Math.max(...lineItems.map(it => it.height));
          let hasBold = lineItems.some(it => it.isBold);

          if (!lineText) continue;

          if (maxHeight > avgHeight * 1.4) {
            mdLines.push(`\n### ${lineText}\n`);
          } else if (maxHeight > avgHeight * 1.15 || (hasBold && maxHeight >= avgHeight * 0.95 && lineText.length < 100)) {
            mdLines.push(`\n#### ${lineText}\n`);
          } else if (hasBold) {
            if (/^[\bullet\-\*]/.test(lineText)) {
              mdLines.push(`- **${lineText.replace(/^[\bullet\-\*]\s*/, '')}**`);
            } else {
              mdLines.push(`**${lineText}**`);
            }
          } else {
            mdLines.push(lineText);
          }
        }
      }

      output.textContent = mdLines.length > 0 ? mdLines.join('\n') : 'No content extracted.';
    }

    async function extractHeadersOnly(pdfDoc) {
      const output = document.getElementById('output');
      let results = [];

      const outline = await pdfDoc.getOutline().catch(() => null);
      if (outline && outline.length > 0) {
        function extractOutlineTitles(items) {
          let titles = [];
          for (let item of items) {
            if (item.title) titles.push(item.title.trim());
            if (item.items && item.items.length > 0) {
              titles.push(...extractOutlineTitles(item.items));
            }
          }
          return titles;
        }
        results.push("--- OUTLINE TITLES ---");
        results.push(...extractOutlineTitles(outline));
      }

      for (let i = 1; i <= pdfDoc.numPages; i++) {
        output.textContent = `Checking headers on Page ${i} of ${pdfDoc.numPages}...`;
        const page = await pdfDoc.getPage(i);
        const textContent = await page.getTextContent();
        const items = textContent.items;
        const styles = textContent.styles || {};

        if (items.length === 0) continue;

        let heights = items.map(item => item.height || Math.abs(item.transform[3]));
        let avgHeight = heights.reduce((a, b) => a + b, 0) / heights.length;

        let linesMap = {};
        items.forEach(item => {
          if (!item.str || !item.str.trim()) return;
          let y = Math.round(item.transform[5] / 4) * 4;
          if (!linesMap[y]) linesMap[y] = [];
          
          let fontName = item.fontName;
          let fontStyle = styles[fontName] || {};
          let isBold = (fontStyle.name && /bold|black|heavy/i.test(fontStyle.name)) || 
                       (fontName && /bold|black|heavy/i.test(fontName));

          linesMap[y].push({
            str: item.str,
            height: item.height || Math.abs(item.transform[3]),
            isBold: isBold,
            x: item.transform[4]
          });
        });

        let sortedYs = Object.keys(linesMap).map(Number).sort((a, b) => b - a);
        let pageHeaders = [];

        for (let y of sortedYs) {
          let lineItems = linesMap[y].sort((a, b) => a.x - b.x);
          let lineText = lineItems.map(it => it.str).join(' ').trim();
          let maxHeight = Math.max(...lineItems.map(it => it.height));
          let hasBold = lineItems.some(it => it.isBold);

          if ((maxHeight > avgHeight * 1.1) || (hasBold && maxHeight >= avgHeight * 0.95 && lineText.length < 120)) {
            pageHeaders.push(lineText);
          }
        }

        let uniqueHeaders = [...new Set(pageHeaders)];
        if (uniqueHeaders.length > 0) {
          results.push(`--- Page ${i} ---`);
          results.push(...uniqueHeaders);
        }
      }

      output.textContent = results.length > 0 ? results.join('\n') : 'No headers found.';
    }

    function copyOutput() {
      const text = document.getElementById('output').textContent;
      navigator.clipboard.writeText(text).then(() => {
        const btnText = document.getElementById('copyBtnText');
        btnText.textContent = 'Copied!';
        showToast('Copied content to clipboard!', 'success');
        setTimeout(() => btnText.textContent = 'Copy', 2000);
      });
    }

    function downloadMd() {
      const text = document.getElementById('output').textContent;
      const blob = new Blob([text], { type: 'text/markdown' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = currentFile ? `${currentFile.name.replace(/\.pdf$/i, '')}.md` : 'document.md';
      a.click();
      URL.revokeObjectURL(url);
      showToast('Downloaded .md document', 'success');
    }
    new AppHeader({
      title: "PDF Header & Markdown Extractor",
      subtitle: "Client-Side PDF Text & Structure Parser",
      icon: "fa-solid fa-file-pdf",
      iconBg: "bg-rose-500 text-white"
    }).mount();
  </script>
</body>
</html>
