  <script type="module">
    class FileService {
  constructor() {}

  async switch(configOrFiles) {
    throw new Error("Method 'switch()' must be implemented.");
  }

  async getFolderContents(folderId = "root") {
    throw new Error("Method 'getFolderContents()' must be implemented.");
  }

  async getFileRecord(id) {
    throw new Error("Method 'getFileRecord()' must be implemented.");
  }

  async getFullBase64(fileId) {
    throw new Error("Method 'getFullBase64()' must be implemented.");
  }

  async createFolder(name, parentId = "root") {
    throw new Error("Method 'createFolder()' must be implemented.");
  }

  async uploadFile(file, parentId = "root", onProgress) {
    throw new Error("Method 'uploadFile()' must be implemented.");
  }

  async deleteFolder(id) {
    throw new Error("Method 'deleteFolder()' must be implemented.");
  }

  async deleteFile(id, fileId) {
    throw new Error("Method 'deleteFile()' must be implemented.");
  }

  async generateZipBlob() {
    throw new Error("Method 'generateZipBlob()' must be implemented.");
  }

  async downloadBackup() {
    await this._ensureCache();
    const items = this._itemsCache;
  
    if (typeof JSZip === "undefined") {
      throw new Error("JSZip is not loaded or defined in the global scope.");
    }
  
    const folders = items.filter(i => i.isFolder);
    const files = items.filter(i => !i.isFolder);
  
    const getFolderPath = parentId => {
      const pathParts = [];
      let currentId = parentId;
      while (currentId && currentId !== "root") {
        const folder = folders.find(f => f.id === currentId);
        if (folder) {
          pathParts.unshift(folder.title || folder.name);
          currentId = folder.parentId;
        } else {
          break;
        }
      }
      return pathParts.join("/");
    };
  
    // 1. Sort files deterministically so the hash order is always consistent
    const fileEntries = files.map(fileRecord => {
      const folderPath = getFolderPath(fileRecord.parentId);
      const filePath = folderPath ? `${folderPath}/${fileRecord.title}` : fileRecord.title;
      return { fileRecord, filePath };
    });
    fileEntries.sort((a, b) => a.filePath.localeCompare(b.filePath));
  
    // 2. Gather raw file bytes & paths to feed into the hash (completely ignores ZIP metadata)
    const hasherBuffers = [];
    const encoder = new TextEncoder();
  
    for (const { fileRecord, filePath } of fileEntries) {
      const chunks = await this.getFileChunks(fileRecord.fileId || fileRecord.id);
  
      const fullBase64 = chunks.map(c => c.chunkData).join("");
      const base64Data = fullBase64.includes(",")
        ? fullBase64.split(",")[1]
        : fullBase64;
      if (!base64Data) continue;
  
      const binaryString = atob(base64Data);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
  
      // Include both the file path and its raw byte content in the hash
      hasherBuffers.push(encoder.encode(filePath));
      hasherBuffers.push(bytes);
    }
  
    // Combine all file buffers into a single buffer and create the hash
    const totalLength = hasherBuffers.reduce((acc, buf) => acc + buf.length, 0);
    const combinedBuffer = new Uint8Array(totalLength);
    let offset = 0;
    for (const buf of hasherBuffers) {
      combinedBuffer.set(buf, offset);
      offset += buf.length;
    }
  
    const hashBuffer = await crypto.subtle.digest("SHA-256", combinedBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    const hashHex = hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
    const shortHash = hashHex.slice(0, 8); // e.g., "a1b2c3d4"
  
    // 3. Generate your normal ZIP blob using your existing function
    const content = await this.generateZipBlob();
  
    // 4. Download file with today's date + the pure content hash
    const dateStr = new Date().toISOString().slice(0, 10);
    const downloadAnchor = document.createElement("a");
    downloadAnchor.href = URL.createObjectURL(content);
    downloadAnchor.download = `backup_${dateStr}_${shortHash}.zip`;
  
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
  }

  // ---------- helpers ----------
  _guessPreviewType(type = "", ext = "") {
    const t = (type || "").toLowerCase();
    const e = (ext || "").toLowerCase();

    if (
      t.startsWith("image/") ||
      ["png", "jpg", "jpeg", "gif", "webp", "bmp", "svg", "ico"].includes(e)
    ) {
      return "image";
    }
    if (
      t.startsWith("video/") ||
      ["mp4", "webm", "ogg", "mov", "mkv"].includes(e)
    ) {
      return "video";
    }
    if (
      t.startsWith("audio/") ||
      ["mp3", "wav", "ogg", "aac", "m4a", "flac"].includes(e)
    ) {
      return "audio";
    }
    if (
      t.startsWith("text/") ||
      [
        "json", "js", "ts", "jsx", "tsx", "html", "htm", "css", "scss",
        "md", "txt", "xml", "svg", "csv"
      ].includes(e)
    ) {
      return "text";
    }
    return "generic";
  }

  _toDataUrl(fullBase64, mime = "application/octet-stream") {
    if (!fullBase64) return null;
    if (fullBase64.startsWith("data:")) return fullBase64;
    return `data:${mime};base64,${fullBase64}`;
  }

  /** Detect mime from data-URL header or binary magic bytes */
  _detectMimeFromBase64(fullBase64) {
    if (!fullBase64 || typeof fullBase64 !== "string") return null;

    if (fullBase64.startsWith("data:")) {
      const comma = fullBase64.indexOf(",");
      if (comma === -1) return null;
      const header = fullBase64.slice(5, comma);
      return header.split(";")[0].toLowerCase() || null;
    }

    let bytes;
    try {
      const sample = atob(fullBase64.slice(0, 64));
      bytes = new Uint8Array(sample.length);
      for (let i = 0; i < sample.length; i++) bytes[i] = sample.charCodeAt(i);
    } catch {
      return null;
    }

    // PNG
    if (
      bytes[0] === 0x89 &&
      bytes[1] === 0x50 &&
      bytes[2] === 0x4e &&
      bytes[3] === 0x47
    ) {
      return "image/png";
    }
    // JPEG
    if (bytes[0] === 0xff && bytes[1] === 0xd8 && bytes[2] === 0xff) {
      return "image/jpeg";
    }
    // GIF
    if (bytes[0] === 0x47 && bytes[1] === 0x49 && bytes[2] === 0x46) {
      return "image/gif";
    }
    // WEBP: RIFF....WEBP
    if (
      bytes[0] === 0x52 &&
      bytes[1] === 0x49 &&
      bytes[2] === 0x46 &&
      bytes[3] === 0x46 &&
      bytes[8] === 0x57 &&
      bytes[9] === 0x45 &&
      bytes[10] === 0x42 &&
      bytes[11] === 0x50
    ) {
      return "image/webp";
    }
    // BMP
    if (bytes[0] === 0x42 && bytes[1] === 0x4d) {
      return "image/bmp";
    }
    // MP4 / ftyp
    if (
      bytes[4] === 0x66 &&
      bytes[5] === 0x74 &&
      bytes[6] === 0x79 &&
      bytes[7] === 0x70
    ) {
      return "video/mp4";
    }

    return null;
  }
  async _buildPreview(item) {
    const title = item.title || item.name || "Untitled";
    const type = item.type || item.mimeType || "";
    const ext = (item.extension || title.split(".").pop() || "").toLowerCase();

    const fullBase64 = await this.getFullBase64(item.fileId || item.id);
    if (!fullBase64) {
      return {
        previewType: this._guessPreviewType(type, ext),
        thumbnail: null
      };
    }

    const detectedMime = this._detectMimeFromBase64(fullBase64);

    let previewType = "generic";
    if (detectedMime) {
      if (detectedMime.startsWith("image/")) previewType = "image";
      else if (detectedMime.startsWith("video/")) previewType = "video";
      else if (detectedMime.startsWith("audio/")) previewType = "audio";
      else if (
        detectedMime.startsWith("text/") ||
        detectedMime === "application/json" ||
        detectedMime === "application/xml" ||
        detectedMime.includes("javascript")
      ) {
        previewType = "text";
      }
    }

    if (previewType === "generic") {
      previewType = this._guessPreviewType(type, ext);
    }

    if (previewType === "image") {
      const mime = detectedMime?.startsWith("image/")
        ? detectedMime
        : type.startsWith("image/")
          ? type
          : "image/png";
      return {
        previewType,
        thumbnail: this._toDataUrl(fullBase64, mime)
      };
    }

    if (previewType === "video") {
      const mime = detectedMime?.startsWith("video/")
        ? detectedMime
        : type.startsWith("video/")
          ? type
          : "video/mp4";
      return {
        previewType,
        thumbnail: this._toDataUrl(fullBase64, mime)
      };
    }

    if (previewType === "text") {
      let text = fullBase64;
      try {
        const raw = fullBase64.includes(",")
          ? fullBase64.split(",")[1]
          : fullBase64;
        text = atob(raw);
      } catch {
        // already plain text
      }
      return {
        previewType,
        thumbnail: text.substring(0, 180)
      };
    }

    return { previewType, thumbnail: null };
  }
  _readTextSnippet(file) {
    return new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result.substring(0, 180));
      reader.onerror = () => resolve("");
      reader.readAsText(file.slice(0, 300));
    });
  }
  _calculateFolderSize(node) {
    let totalSize = 0;
    const children = node.__children || {};
    const files = node.__files || [];

    for (const file of files) totalSize += file.size || 0;
    for (const key in children) {
      totalSize += this._calculateFolderSize(children[key]);
    }
    return totalSize;
  }
}

export class FileAdapterService extends FileService {
  constructor() {
    super();
    this.folderStructure = {};
    this.nodeMap = new Map();
    this.fileMap = new Map();
  }

  async switch(fileList) {
    const files = Array.from(fileList);

    this.folderStructure = {
      id: "root",
      name: "root",
      __children: {},
      __files: []
    };
    this.nodeMap.clear();
    this.fileMap.clear();
    this.nodeMap.set("root", this.folderStructure);

    if (!files.length) return;

    const firstPath = files[0].webkitRelativePath || files[0].name;
    const rootFolderName = firstPath.split("/")[0] || "root";
    this.folderStructure.name = rootFolderName;

    let folderIdCounter = 1;
    let fileIdCounter = 1;

    for (const file of files) {
      const relativePath = file.webkitRelativePath || file.name;
      const parts = relativePath.split("/");

      if (parts.length > 1 && parts[0] === rootFolderName) {
        parts.shift();
      }

      const fileName = parts.pop();
      if (!fileName) continue;

      let currentLevelNode = this.folderStructure;

      for (const part of parts) {
        if (!currentLevelNode.__children[part]) {
          const newFolderId = `folder_${folderIdCounter++}`;
          const newFolderNode = {
            id: newFolderId,
            name: part,
            parentId: currentLevelNode.id,
            __children: {},
            __files: []
          };
          currentLevelNode.__children[part] = newFolderNode;
          this.nodeMap.set(newFolderId, newFolderNode);
        }
        currentLevelNode = currentLevelNode.__children[part];
      }

      const ext = fileName.split(".").pop().toLowerCase();
      const isImage = file.type.startsWith("image/");
      const isVideo = file.type.startsWith("video/");
      const isAudio = file.type.startsWith("audio/");
      const isText =
        file.type.startsWith("text/") ||
        [
          "json", "js", "ts", "jsx", "tsx", "html", "htm", "css", "scss",
          "md", "txt", "xml", "svg", "csv"
        ].includes(ext);

      let previewType = "generic";
      let thumbnail = null;
      const fileUrl = URL.createObjectURL(file);

      if (isImage) {
        previewType = "image";
        thumbnail = fileUrl;
      } else if (isVideo) {
        previewType = "video";
        thumbnail = fileUrl;
      } else if (isAudio) {
        previewType = "audio";
      } else if (isText) {
        previewType = "text";
        thumbnail = await this._readTextSnippet(file);
      }

      const fileId = `file_${fileIdCounter++}`;
      const fileRecord = {
        id: fileId,
        fileId: fileId,
        title: fileName,
        name: fileName,
        isFolder: false,
        parentId: currentLevelNode.id,
        path: relativePath,
        size: file.size,
        type: file.type,
        extension: ext,
        fileUrl,
        previewType,
        thumbnail
      };

      currentLevelNode.__files.push(fileRecord);
      this.fileMap.set(fileId, fileRecord);
    }
  }

  async getFolderContents(folderId = "root") {
    const node = this.nodeMap.get(folderId) || this.folderStructure;
    const children = node.__children || {};
    const files = node.__files || [];

    const folders = Object.values(children).map(child => ({
      id: child.id,
      title: child.name,
      name: child.name,
      isFolder: true,
      parentId: node.id,
      size: this._calculateFolderSize(child)
    }));

    return {
      folders,
      files,
      currentFolderName: node.name || "Home"
    };
  }

  async getFileRecord(id) {
    return this.fileMap.get(id) || null;
  }

  /** Local: returns blob URL (not base64). */
  async getFullBase64(fileId) {
    const file = this.fileMap.get(fileId);
    return file ? file.fileUrl : null;
  }
}

class FileManagerUI {
  constructor(container, callbacks = {}) {
    this.container = container;
    this.callbacks = callbacks;
  }

  init() {
    this._mountUI();
    this._bindEvents();
  }

  _mountUI() {
    if (!this.container) return;

    this.container.innerHTML = FileManagerUI.getMainLayoutHTML();
    document.body.insertAdjacentHTML("beforeend", FileManagerUI.getOverlaysHTML());
    document.body.insertAdjacentHTML("beforeend", FileManagerUI.getPreviewModalHTML());
  }

  // --------------------------------------------------
  // UI Event Binding
  // --------------------------------------------------
  _bindEvents() {
    document.addEventListener("click", () => {
      FileManagerUI.hideContextMenu();
    });

    // Close Preview Modal Event
    document.getElementById("closeViewModalBtn")?.addEventListener("click", () => {
      FileManagerUI.hidePreviewModal();
    });

    this.container.querySelector("#backBtn")?.addEventListener("click", () => {
      this.callbacks.onBack?.();
    });

    this.container.addEventListener("click", (e) => {
      const target = e.target.closest("[data-action]");
      if (!target) return;

      const action = target.dataset.action;
      const id = target.dataset.id;
      const fileId = target.dataset.fileId;

      if (action === "navigate") this.callbacks.onNavigate?.(id);
      if (action === "view") this.callbacks.onView?.(id, fileId);
    });

    this.container.addEventListener("contextmenu", (e) => {
      const target = e.target.closest("[data-context]");
      if (!target) return;

      e.preventDefault();
      const type = target.dataset.context;
      const id = target.dataset.contextId;
      const fileId = target.dataset.fileId || null;
      const fileName = target.dataset.fileName || "";

      const isFile = type === "file";
      const isEditable = isFile && this.callbacks.isEditableFile?.(fileName);
      
      this.callbacks.onContextMenuTrigger?.({ type, id, fileId, fileName });
      FileManagerUI.showContextMenu(e.clientY, e.clientX, isFile, isEditable);
    });

    document.getElementById("ctxEditBtn")?.addEventListener("click", () => {
      this.callbacks.onCtxEdit?.();
      FileManagerUI.hideContextMenu();
    });

    document.getElementById("ctxDeleteBtn")?.addEventListener("click", () => {
      this.callbacks.onCtxDelete?.();
      FileManagerUI.hideContextMenu();
    });

    document.getElementById("ctxDownloadBtn")?.addEventListener("click", () => {
      this.callbacks.onCtxDownload?.();
      FileManagerUI.hideContextMenu();
    });

    this.container.querySelector("#openFolderModalBtn")?.addEventListener("click", () => {
      FileManagerUI.setFolderNameInputValue("");
      FileManagerUI.showFolderModal();
    });
    document.getElementById("cancelFolderBtn")?.addEventListener("click", () => FileManagerUI.hideFolderModal());
    document.getElementById("submitFolderBtn")?.addEventListener("click", () => {
      const name = FileManagerUI.getFolderNameInputValue();
      if (!name) return;
      this.callbacks.onCreateFolder?.(name);
      FileManagerUI.hideFolderModal();
    });

    this.container.querySelector("#openTextModalBtn")?.addEventListener("click", () => {
      this.callbacks.onOpenTextCreate?.();
    });
    document.getElementById("closeTextModalBtn")?.addEventListener("click", () => FileManagerUI.hideTextEditorModal());
    document.getElementById("cancelTextBtn")?.addEventListener("click", () => FileManagerUI.hideTextEditorModal());
    document.getElementById("submitTextBtn")?.addEventListener("click", () => {
      this.callbacks.onSaveTextFile?.();
    });

    this.container.querySelector("#openCreateModalBtn")?.addEventListener("click", () => {
      FileManagerUI.resetFileForm();
      FileManagerUI.showFileModal();
    });
    document.getElementById("closeFileModalBtn")?.addEventListener("click", () => FileManagerUI.hideFileModal());
    document.getElementById("cancelFileBtn")?.addEventListener("click", () => FileManagerUI.hideFileModal());
    document.getElementById("createFileForm")?.addEventListener("submit", (e) => {
      e.preventDefault();
      const files = FileManagerUI.getFileInputFiles();
      if (!files?.length) return;
      this.callbacks.onUploadFiles?.(files);
      FileManagerUI.hideFileModal();
    });
  }

  // --------------------------------------------------
  // Formatting Helper
  // --------------------------------------------------
  static formatBytes(bytes) {
    if (bytes === 0 || isNaN(bytes) || bytes == null) return "0 B";
    const k = 1024;
    const sizes = ["B", "KB", "MB", "GB"];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + " " + sizes[i];
  }

  // --------------------------------------------------
  // Preview Rendering Logic
  // --------------------------------------------------
  static showPreviewLoading(fileName) {
    const title = document.getElementById("viewModalTitle");
    const date = document.getElementById("viewDate");
    const content = document.getElementById("viewContentContainer");
    const modal = document.getElementById("viewModal");

    if (title) title.textContent = fileName;
    if (date) date.innerHTML = `<i class="fa-regular fa-clock"></i> Recent`;
    if (content) {
      content.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-2xl text-blue-500 mb-2"></i><p class="text-xs text-slate-500">Loading file...</p>`;
    }
    modal?.classList.remove("hidden");
  }

  static renderPreview(fileRecord, fileUrl) {
    const content = document.getElementById("viewContentContainer");
    const downloadBtn = document.getElementById("downloadFileBtn");
    if (!content) return;

    const fileNameLower = fileRecord.title.toLowerCase();
    const isBlob = fileUrl.startsWith("blob:");

    if (fileUrl.startsWith("data:image/") || (isBlob && /\.(jpg|jpeg|png|gif|webp|svg)$/i.test(fileNameLower))) {
      content.innerHTML = `<img src="${fileUrl}" class="w-full h-full object-contain">`;
    } else if (fileUrl.startsWith("data:video/") || (isBlob && /\.(mp4|webm|ogg|mov)$/i.test(fileNameLower))) {
      content.innerHTML = `<video controls class="w-full h-full object-contain bg-black"><source src="${fileUrl}"></video>`;
    } else if (fileNameLower.endsWith(".mp3") || fileNameLower.endsWith(".wav") || fileNameLower.endsWith(".ogg") || fileUrl.startsWith("data:audio/")) {
      content.innerHTML = `
        <div class="flex flex-col items-center justify-center h-full gap-4 p-6">
          <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-2xl shadow-inner">
            <i class="fa-solid fa-music"></i>
          </div>
          <p class="text-sm font-medium text-slate-700 text-center truncate w-full">${fileRecord.title}</p>
          <audio controls class="w-full max-w-md">
            <source src="${fileUrl}">
            Your browser does not support the audio element.
          </audio>
        </div>
      `;
    } else if (fileNameLower.endsWith(".html") || fileNameLower.endsWith(".htm")) {
      // Handle base64 encoded text/html data URLs properly
      if (fileUrl.includes(";base64,")) {
        try {
          const base64Content = fileUrl.split(',')[1];
          const decodedHtml = decodeURIComponent(escape(atob(base64Content)));
          const blob = new Blob([decodedHtml], { type: 'text/html' });
          const blobUrl = URL.createObjectURL(blob);
          content.innerHTML = `<iframe src="${blobUrl}" class="w-full h-full border-0 bg-white"></iframe>`;
          return;
        } catch (e) {
          // fallback to standard iframe
        }
      }
      content.innerHTML = `<iframe src="${fileUrl}" class="w-full h-full border-0 bg-white"></iframe>`;
    } else if (fileNameLower.endsWith(".txt") || fileUrl.startsWith("data:text/plain")) {
      if (isBlob) {
        fetch(fileUrl)
          .then(res => res.text())
          .then(textContent => {
            content.innerHTML = `<pre class="w-full h-full overflow-auto p-4 bg-slate-950 text-slate-100 text-xs font-mono whitespace-pre-wrap">${textContent}</pre>`;
          })
          .catch(() => {
            content.innerHTML = `<p class="text-xs text-red-400">Failed to load text preview.</p>`;
          });
        return;
      } else {
        try {
          let textContent = "";
          if (fileUrl.includes(";base64,")) {
            const base64Content = fileUrl.split(',')[1];
            textContent = decodeURIComponent(escape(atob(base64Content)));
          } else {
            textContent = decodeURIComponent(fileUrl.split(',')[1] || "");
          }
          content.innerHTML = `<pre class="w-full h-full overflow-auto p-4 bg-slate-950 text-slate-100 text-xs font-mono whitespace-pre-wrap">${textContent}</pre>`;
        } catch (err) {
          content.innerHTML = `<p class="text-xs text-red-400">Failed to load text preview.</p>`;
        }
      }
    } else if (fileNameLower.endsWith(".pdf") || fileUrl.startsWith("data:application/pdf") || isBlob) {
      content.innerHTML = `<iframe src="${fileUrl}" class="w-full h-full border-0 bg-white"></iframe>`;
    } else {
      content.innerHTML = `<div class="text-center"><i class="fa-solid fa-file-arrow-down text-4xl text-blue-500 mb-2"></i><p class="text-xs font-semibold text-slate-300">${fileRecord.title}</p></div>`;
    }

    if (downloadBtn) {
      downloadBtn.href = fileUrl;
      downloadBtn.download = fileRecord.title;
    }
  }

  static renderFileItem(file) {

    const ext = file.extension || name.split(".").pop()?.toLowerCase() || "";
    const sizeLabel = file.size != null ? FileManagerUI.formatBytes(file.size) : `${file.totalParts || 1} chunks`;
    const previewHTML = FileManagerUI.getFilePreviewHTML(file, ext, name);

    return `
      <div data-action="view" data-id="${file.id}" data-file-id="${file.fileId}" data-context="file" data-context-id="${file.id}" data-file-name="${name}" class="group relative bg-white border border-slate-200 hover:border-blue-500 rounded-xl p-3 flex flex-col items-center justify-between text-center cursor-pointer shadow-sm hover:shadow-md transition-all duration-150 aspect-square overflow-hidden">

          <span class="w-full text-xs font-semibold text-slate-700 truncate text-[11px]" title="${name}">${name}</span>
          <span class="text-[9px] text-slate-400 font-mono mt-0.5">${sizeLabel}</span>
        </div>
      </div>`;
  }

  static getFilePreviewHTML(file, ext, name) {
    let previewHTML = `<i class="fa-regular fa-file-lines text-slate-400 text-3xl"></i>`;
    if (file.previewType === 'image' && file.thumbnail) {
      previewHTML = `<img src="${file.thumbnail}" alt="${name}" class="w-full h-full object-cover rounded-lg" />`;
    } else if (file.previewType === 'video' && file.thumbnail) {
      previewHTML = `<video src="${file.thumbnail}" class="widget-video-preview w-full h-full object-cover rounded-lg pointer-events-none" muted playsinline preload="metadata"></video><div class="absolute bottom-1 right-1 bg-black/60 text-white text-[8px] px-1 rounded font-mono">VIDEO</div>`;
    } else if (file.previewType === 'audio') {
      previewHTML = `<div class="flex flex-col items-center justify-center text-blue-500"><i class="fa-solid fa-file-audio text-3xl mb-1"></i><span class="text-[9px] font-mono text-slate-500 uppercase">${ext}</span></div>`;
    } else if (file.previewType === 'text' && file.thumbnail) {
      const escapedText = String(file.thumbnail).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
      previewHTML = `<pre class="text-[8px] leading-tight text-slate-500 font-mono text-left p-1.5 overflow-hidden w-full h-full select-none opacity-80">${escapedText}</pre>`;
    } else if (["js", "ts", "jsx", "tsx"].includes(ext)) {
      previewHTML = `<i class="fa-brands fa-js text-amber-400 text-3xl"></i>`;
    } else if (["html", "htm"].includes(ext)) {
      previewHTML = `<i class="fa-brands fa-html5 text-orange-400 text-3xl"></i>`;
    } else if (["css", "scss"].includes(ext)) {
      previewHTML = `<i class="fa-brands fa-css3-alt text-blue-500 text-3xl"></i>`;
    } else if (ext === "json") {
      previewHTML = `<i class="fa-solid fa-brackets-curly text-yellow-500 text-3xl"></i>`;
    }
    return previewHTML;
  }

export class FileManager {
  constructor(config = {}) {
    this.container = document.getElementById(config.containerId);
    this.service = config.service;

    this.currentFolderId = "root";
    this.contextTarget = null;
    this.editingFileTarget = null;

    this.editableExtensions = new Set([
      "txt", "js", "ts", "jsx", "tsx", "html", "htm", "css", "scss",
      "json", "md", "py", "sh", "xml", "csv", "svg", "yaml", "yml",
      "env", "ini", "sql", "c", "cpp", "h", "java"
    ]);

    this.ui = new FileManagerUI(this.container, {
      isEditableFile: (filename) => this.isEditableFile(filename),
      onBack: () => this.navigateUp(),
      onNavigate: (id) => this.navigateToFolder(id),
      onView: (id, fileId) => this.viewFile(id, fileId),
      onContextMenuTrigger: (target) => { this.contextTarget = target; },
      onCtxEdit: () => { if (this.contextTarget) this.openTextEditorForEdit(this.contextTarget); },
      onCtxDelete: () => { if (this.contextTarget) this.deleteItem(this.contextTarget); },
      onCtxDownload: () => { if (this.contextTarget && this.contextTarget.type === "file") this.downloadFile(this.contextTarget); },
      onCreateFolder: (name) => this.createFolder(name, this.currentFolderId),
      onOpenTextCreate: () => {
        this.editingFileTarget = null;
        FileManagerUI.openTextCreateModal();
      },
      onSaveTextFile: () => this.saveTextFile(),
      onUploadFiles: (files) => this.uploadFiles(files, this.currentFolderId)
    });
    document.addEventListener("click", async (e) => {
      const targetBtn = e.target.closest(`#${"backupDataBtn"}`);
      if (!targetBtn) return;
      Toast.show("Preparing ZIP backup...", "info");
      try {
        await this.service.downloadBackup();
        Toast.show("ZIP backup downloaded successfully!", "success");
      } catch (err) {
        Toast.show(`Failed to generate ZIP: ${err.message}`, "error");
      }
    });
  }

  init() {
    this.ui.init();
    this.loadCurrentFolder();
  }

  async switch(collections) {
    await this.service.switch(collections);
    this.currentFolderId = "root";
    await this.loadCurrentFolder();
  }

  isEditableFile(filename = "") {
    const ext = filename.split(".").pop()?.toLowerCase() || "";
    return this.editableExtensions.has(ext);
  }

  async loadCurrentFolder() {
    const grid = this.container?.querySelector("#fileGridContainer");
    if (!grid) return;

    grid.innerHTML = FileManagerUI.getLoadingHTML();

    try {
      const { folders, files, currentFolderName } =
        await this.service.getFolderContents(this.currentFolderId);
      this.render(folders, files, currentFolderName);
    } catch (err) {
      Toast.show(`Error loading folder: ${err.message}`, "error");
    }
  }

  render(folders = [], files = [], currentFolderName = "Home") {
    const grid = this.container.querySelector("#fileGridContainer");
    const pathText = this.container.querySelector("#pathText");
    const countBadge = this.container.querySelector("#fileCountBadge");
    const backBtn = this.container.querySelector("#backBtn");
    if (!grid) return;

    const isRoot = this.currentFolderId === "root";

    pathText.textContent = isRoot ? "/" : `/${currentFolderName}`;
    countBadge.textContent = `${folders.length + files.length} items`;

    if (isRoot) {
      backBtn.classList.add("opacity-40", "cursor-not-allowed");
      backBtn.classList.remove("cursor-pointer");
      backBtn.disabled = true;
    } else {
      backBtn.classList.remove("opacity-40", "cursor-not-allowed");
      backBtn.classList.add("cursor-pointer");
      backBtn.disabled = false;
    }

    if (folders.length === 0 && files.length === 0) {
      grid.innerHTML = FileManagerUI.getEmptyFolderHTML();
      return;
    }

    let html = "";

    folders.forEach(folder => {
      html += FileManagerUI.renderFolderItem(folder);
    });

    files.forEach(file => {
      html += FileManagerUI.renderFileItem(file);
    });

    grid.innerHTML = html;

    grid.querySelectorAll('.widget-video-preview').forEach((videoEl) => {
      videoEl.addEventListener('loadedmetadata', () => {
        videoEl.currentTime = Math.min(1, videoEl.duration / 4);
      });
    });
  }

  navigateToFolder(folderId) {
    this.currentFolderId = folderId;
    this.loadCurrentFolder();
  }

  navigateUp() {
    if (this.currentFolderId !== "root") {
      this.navigateToFolder("root");
    }
  }

  async createFolder(name, parentId) {
    await this.service.createFolder(name, parentId);
    Toast.show("Folder created!", "success");
    this.loadCurrentFolder();
  }

  async openTextEditorForEdit(target) {
    const fileRecord = await this.service.getFileRecord(target.id);
    if (!fileRecord) return;

    const fullBase64 = await this.service.getFullBase64(fileRecord.fileId);
    let fileContent = "";
    try {
      const base64Data = fullBase64.split(",")[1] || fullBase64;
      fileContent = decodeURIComponent(escape(atob(base64Data)));
    } catch (e) {
      fileContent = "";
    }

    this.editingFileTarget = target;
    FileManagerUI.openTextEditModal(fileRecord.title, fileContent);
  }

  async saveTextFile() {
    const fileName = FileManagerUI.getFileNameInputValue();
    if (!fileName) return;

    const finalName = (!this.editingFileTarget && !fileName.includes(".")) ? `${fileName}.txt` : fileName;
    const content = FileManagerUI.getFileContentInputValue();
    const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
    const fileObj = new File([blob], finalName, { type: "text/plain" });

    if (this.editingFileTarget) {
      try {
        await this.service.deleteFile(this.editingFileTarget.id, this.editingFileTarget.fileId);
      } catch (e) {
        console.error(e);
      }
      this.editingFileTarget = null;
    }

    await this.uploadFiles([fileObj], this.currentFolderId);
    FileManagerUI.hideTextEditorModal();
  }

  async uploadFiles(files, parentId) {
    const submitBtn = document.getElementById("submitFileBtn");
    if (submitBtn) submitBtn.disabled = true;

    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      try {
        await this.service.uploadFile(
          file,
          parentId,
          (statusText) => {
            if (submitBtn) {
              submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> (${i + 1}/${files.length}) ${statusText}`;
            }
          }
        );
        Toast.show(`Uploaded: ${file.name}`, "success");
      } catch (err) {
        Toast.show(`Failed to upload ${file.name}: ${err.message}`, "error");
      }
    }

    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.textContent = "Upload File";
    }

    this.loadCurrentFolder();
  }

  async deleteItem(target) {
    if (target.type === "folder") {
      if (!confirm("Delete folder?")) return;
      await this.service.deleteFolder(target.id);
      Toast.show("Folder deleted", "success");
    } else {
      if (!confirm("Delete file and its chunks?")) return;
      await this.service.deleteFile(target.id, target.fileId);
      Toast.show("File deleted", "success");
    }
    this.loadCurrentFolder();
  }

  async downloadFile(target) {
    const fileRecord = await this.service.getFileRecord(target.id);
    if (!fileRecord) return;

    const fullBase64 = await this.service.getFullBase64(fileRecord.fileId);

    const a = document.createElement("a");
    a.href = fullBase64;
    a.download = fileRecord.title;
    document.body.appendChild(a);
    a.click();
    a.remove();

    Toast.show(`Downloaded ${fileRecord.title}`, "success");
  }

  async viewFile(id, fileId) {
    const fileRecord = await this.service.getFileRecord(id);
    if (!fileRecord) return;

    FileManagerUI.showPreviewLoading(fileRecord.title);

    const fullBase64 = await this.service.getFullBase64(fileRecord.fileId);
    FileManagerUI.renderPreview(fileRecord, fullBase64);
  }
}
    const service = new FileAdapterService();
    let folderManager = null;

    document.querySelectorAll('.widget-folder-input-main, .widget-folder-input-header').forEach(input => {
      input.addEventListener('change', async (e) => {
        if (folderManager == null) {
          folderManager = new FileManager({
            containerId: 'widget-browser-wrapper',
            service: service
          });
          folderManager.init();
        }
        const files = e.target.files;
        if (!files || files.length === 0) return;
        await folderManager.switch(files);
      });
    });
  </script>
</body>
