<!DOCTYPE html>
<html lang="en"> 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Manager</title>
  <script src="/js/utils.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style id="customScrollbarStyle">
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/omggif@1.0.10/omggif.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col overflow-x-hidden">
  <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-30 w-full">
    <div class="max-w-8xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4 w-full">
      <!-- Logo, Mobile Hamburger & Titles -->
      <div class="flex items-center space-x-3">
        <!-- Mobile Menu Toggle Button -->
        <button id="mobileMenuBtn" class="md:hidden text-slate-300 hover:text-white p-2 rounded-xl focus:outline-none">
          <i class="fa-solid fa-bars text-lg"></i>
        </button>
        <div class="bg-blue-500 text-white p-2 rounded-xl shadow-md">
          <i class="fa-solid fa-folder-tree text-lg"></i>
        </div>
        <div>
          <h1 id="appTitle" class="text-base sm:text-lg font-bold tracking-tight truncate max-w-[200px] sm:max-w-none">File Manager - Home</h1>
          <p class="text-[10px] sm:text-[11px] text-slate-400">Fast On-Demand Loading &amp; Chunked Storage</p>
        </div>
      </div>

      <!-- Status & Action Button -->
      <div class="flex items-center space-x-3">  
        <button id="toggleConfigBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-xl text-xs transition flex items-center gap-2 border border-slate-700">
          <i class="fa-solid fa-gear"></i>
          <span>Config</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile Sidebar Backdrop Overlay -->
  <div id="sidebarBackdrop" class="fixed inset-0 bg-slate-950/50 backdrop-blur-sm z-40 hidden md:hidden transition-opacity"></div>

  <!-- Main Workspace Layout -->
  <div class="flex-1 flex overflow-hidden relative">
    <!-- Sidebar Container (Transforms to Off-Canvas Drawer on Mobile) -->
    <div id="sidebarContainer" class="fixed md:static inset-y-0 left-0 z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out bg-white md:bg-transparent shadow-2xl md:shadow-none flex flex-col shrink-0"></div>

    <!-- Content Area Container -->
    <main id="appContent" class="flex-1 flex flex-col bg-slate-50 p-3 sm:p-6 overflow-y-auto custom-scrollbar w-full">
    </main>
  </div>

  <script type="module">
    import { FirebaseService } from "./js/firebase-service.js";
    import { FileManagerWrapper } from "./js/manager.js";
    import { FileManager } from "./js/file/file.js";
    import { FileAdapterService } from "./js/file/service.js";

    const configManager = new ConfigManager("toggleConfigBtn");
    const fbService = new FirebaseService();
    
    // Initialize FileManager instance ONCE
    const fileManager = new FileManagerWrapper({
      containerId: "appContent",
      fbService: fbService
    });

    const collectionConfigs = {
      file: {
        title: "File Manager - File",
        items: "book_files",
        fileChunks: "book_file_chunks"
      },
      memo: {
        title: "File Manager - Memo",
        items: "memo_files",
        fileChunks: "memo_file_chunks"
      }
    };

    const sidebarContainer = document.getElementById("sidebarContainer");
    const sidebarBackdrop = document.getElementById("sidebarBackdrop");
    const mobileMenuBtn = document.getElementById("mobileMenuBtn");

    function toggleMobileSidebar(forceClose = false) {
      const isClosed = sidebarContainer.classList.contains("-translate-x-full");
      if (forceClose || !isClosed) {
        sidebarContainer.classList.add("-translate-x-full");
        sidebarBackdrop.classList.add("hidden");
      } else {
        sidebarContainer.classList.remove("-translate-x-full");
        sidebarBackdrop.classList.remove("hidden");
      }
    }

    mobileMenuBtn.addEventListener("click", () => toggleMobileSidebar());
    sidebarBackdrop.addEventListener("click", () => toggleMobileSidebar(true));

    function switchSpace(spaceKey) {
      // Automatically close mobile menu on selection
      if (window.innerWidth < 768) {
        toggleMobileSidebar(true);
      }

      if (spaceKey === "home") {
        document.getElementById("appTitle").textContent = "File Manager - Home";
        document.getElementById("appContent").innerHTML = `
          <div class="max-w-4xl mx-auto p-4 sm:p-6 space-y-4 sm:space-y-6">
            <h1 class="text-xl sm:text-2xl font-bold text-slate-800">Welcome to Home</h1>
            <p class="text-sm sm:text-base text-slate-600">This is the home page dashboard.</p>
          </div>
        `;
      } else if (spaceKey === "folder") {
        document.getElementById("appTitle").textContent = "File Manager - Folder";
        document.getElementById("appContent").innerHTML = `<div class="bg-white text-slate-800 rounded-2xl shadow-2xl border border-slate-200 w-full max-w-6xl h-[90vh] flex flex-col overflow-hidden">
        
        <!-- Header -->
        <div class="bg-slate-50 px-5 py-3 border-b border-slate-200 flex items-center justify-between gap-4 shrink-0">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center text-lg shadow-inner">
              <i class="fa-solid fa-folder-tree"></i>
            </div>
            <div>
              <h3 class="text-sm font-bold text-slate-900">System Folder Manager</h3>
            </div>
          </div>

          <div class="flex items-center gap-2">
            <label class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-2 shadow-sm cursor-pointer">
              <i class="fa-solid fa-folder-plus"></i> Select Folder
              <input type="file" class="widget-folder-input-header hidden" webkitdirectory directory multiple>
            </label>
            <button type="button" class="widget-close-btn text-slate-400 hover:text-slate-700 text-xl px-2 py-1 transition ml-2 cursor-pointer">&times;</button>
          </div>
        </div>

        <!-- Main Content Container assigned to FileManager -->
        <div id="widget-browser-wrapper" class="flex-1 bg-slate-50 overflow-hidden flex flex-col min-h-0 relative">
          <!-- Full-Screen Dropzone -->
          <div class="widget-select-screen flex-1 bg-white hover:bg-blue-50/20 transition-all p-8 flex flex-col items-center justify-center text-center relative cursor-pointer group border-2 border-dashed border-slate-200 hover:border-blue-500">
            <input type="file" class="widget-folder-input-main absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20" webkitdirectory directory multiple>
            <div class="pointer-events-none flex flex-col items-center justify-center">
              <div class="w-20 h-20 bg-blue-50 text-blue-600 rounded-3xl flex items-center justify-center text-3xl group-hover:scale-105 transition-transform mb-4 shadow-inner">
                <i class="fa-solid fa-folder-open"></i>
              </div>
              <h4 class="text-sm font-bold text-slate-800 mb-1">Click anywhere to select a folder</h4>
              <p class="text-xs text-slate-400 max-w-sm">Loads directory layout with instant previews and computed folder sizes.</p>
            </div>
          </div>
        </div>
      </div>`;
        const service = new FileAdapterService();
        let folderManager = null;
        document.querySelector('.widget-folder-input-main, .widget-folder-input-header')
          .addEventListener('change', async (e) => {
            if (folderManager == null) {
              folderManager = new FileManager({
                containerId: 'widget-browser-wrapper',
                service: service
              });
              folderManager.init();
            }
            const files = e.target.files;
            if (!files || files.length === 0) return;
            console.log(files);
            await folderManager.switch(files);
            console.log(`Loaded ${files.length} items successfully via service switch!`);
        });
      } else {
        const config = collectionConfigs[spaceKey];
        document.getElementById("appTitle").textContent = config.title;
        document.getElementById("appContent").innerHTML = `<div id="fileManagerApp" class="w-full h-full flex flex-col"></div>`;
        fileManager.containerId = "fileManagerApp";
        fileManager.init();
        fileManager.fileManager.switch(config);
        window.fileManager = fileManager;
      }
    }

    // Khởi tạo Sidebar Class
    const sidebar = new Sidebar({
      containerId: "sidebarContainer",
      activeSpace: "home",
      items: [
        { id: "navHome", spaceKey: "home", label: "Home", icon: "fa-solid fa-house" },
        { id: "navFile", spaceKey: "file", label: "File", icon: "fa-solid fa-folder" },
        { id: "navMemo", spaceKey: "memo", label: "Memo", icon: "fa-solid fa-note-sticky" },
        { id: "navFolder", spaceKey: "folder", label: "Folder", icon: "fa-solid fa-folder" }
      ],
      onSelect: (spaceKey) => {
        switchSpace(spaceKey);
      }
    });
    // Render ban đầu
    switchSpace("home");
  </script>
</body>
</html>
