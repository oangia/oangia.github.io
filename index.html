<!DOCTYPE html>
<html lang="en"> 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Manager - Folder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style id="customScrollbarStyle">
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/omggif@1.0.10/omggif.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col overflow-x-hidden">
  <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-30 w-full">
    <div class="max-w-8xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4 w-full">
      <!-- Logo & Titles -->
      <div class="flex items-center space-x-3">
        <div class="bg-blue-500 text-white p-2 rounded-xl shadow-md">
          <i class="fa-solid fa-folder-tree text-lg"></i>
        </div>
        <div>
          <h1 id="appTitle" class="text-base sm:text-lg font-bold tracking-tight truncate max-w-[200px] sm:max-w-none">File Manager - Folder</h1>
          <p class="text-[10px] sm:text-[11px] text-slate-400">Fast On-Demand Loading &amp; Chunked Storage</p>
        </div>
      </div>

      <!-- Status & Action Button -->
      <div class="flex items-center space-x-3">  
        <button id="toggleConfigBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-xl text-xs transition flex items-center gap-2 border border-slate-700">
          <i class="fa-solid fa-gear"></i>
          <span>Config</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Workspace Layout -->
  <div class="flex-1 flex overflow-hidden relative">
    <!-- Content Area Container -->
    <main id="appContent" class="flex-1 flex flex-col bg-slate-50 p-3 sm:p-6 overflow-y-auto custom-scrollbar w-full items-center justify-center">
    </main>
  </div>

  <script>
    class Cookie {
      static set(name, value, days = 30) {
        const expires = new Date(Date.now() + days * 24 * 60 * 60 * 1000).toUTCString();
        document.cookie = `${name}=${encodeURIComponent(value)}; expires=${expires}; path=/; SameSite=None; Secure`;
      }
      static get(name) {
        const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
        return match ? decodeURIComponent(match[2]) : null;
      }
      static erase(name) {
        document.cookie = `${name}=; Max-Age=-9999999; path=/; SameSite=None; Secure`;
      }
    }

    class Toast {
      static ensureDOM() {
        if (document.getElementById("toastContainer")) return;
        document.body.insertAdjacentHTML("beforeend", '<div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm pointer-events-none"></div>');
      }
      static show(e, t = "info") {
        Toast.ensureDOM();
        let s = document.getElementById("toastContainer");
        if (!s) return;
        const a = document.createElement("div"),
              o = { success: "bg-emerald-600", error: "bg-red-600", info: "bg-slate-900" };
        a.className = `flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg text-xs font-medium text-white ${o[t] || o.info} transition-all transform translate-y-2 opacity-0 pointer-events-auto`;
        a.innerHTML = `<i class="fa-solid fa-circle-info text-base"></i> <span>${e}</span>`;
        s.appendChild(a);
        requestAnimationFrame(() => a.classList.remove("translate-y-2", "opacity-0"));
        setTimeout(() => {
          a.classList.add("opacity-0", "translate-y-2");
          setTimeout(() => a.remove(), 300);
        }, 3e3);
      }
      static success(e) { Toast.show(e, "success"); }
      static error(e) { Toast.show(e, "error"); }
      static info(e) { Toast.show(e, "info"); }
    }

    class ConfigManager {
      constructor(btnId) {
        this.cookieName = "app_config";
        this.globalKey = "APP_CONFIG";
        this.toggleBtn = document.getElementById(btnId);

        if (!this.toggleBtn) {
          console.warn(`ConfigManager: Button "${btnId}" not found.`);
          return;
        }

        this._injectStylesAndHTML();
        this._initElements();
        this._bindEvents();
        this._checkInitialCookie();
      }

      _injectStylesAndHTML() {
        if (document.getElementById("appConfigModalContainer")) return;

        const container = document.createElement("div");
        container.id = "appConfigModalContainer";
        container.innerHTML = `
          <div id="appConfigModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
            <div class="bg-white rounded-2xl max-w-lg w-full shadow-2xl overflow-hidden border border-slate-200">
              <div class="bg-slate-900 text-white p-4 flex justify-between items-center">
                <h2 class="font-semibold text-sm flex items-center gap-2">
                  <i class="fa-solid fa-gear text-amber-400"></i> App Configuration
                </h2>
                <button id="appCloseConfigBtn" class="text-slate-400 hover:text-white text-sm cursor-pointer">
                  <i class="fa-solid fa-xmark text-lg"></i>
                </button>
              </div>
              <div class="p-5 space-y-4">
                <textarea id="appConfigTextarea" placeholder="Paste your JSON configuration here..." class="w-full text-xs font-mono p-3 bg-slate-900 text-emerald-400 rounded-xl border border-slate-700 custom-scrollbar focus:outline-none focus:ring-2 focus:ring-blue-500" rows="8"></textarea>
                <button type="button" id="appSaveConfigBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-xl text-xs flex items-center justify-center gap-2 transition cursor-pointer">
                  <i class="fa-solid fa-floppy-disk"></i> Apply & Save Config
                </button>
              </div>
            </div>
          </div>
        `;
        document.body.appendChild(container);
      }

      _initElements() {
        this.modal = document.getElementById("appConfigModal");
        this.textarea = document.getElementById("appConfigTextarea");
        this.saveBtn = document.getElementById("appSaveConfigBtn");
        this.closeBtn = document.getElementById("appCloseConfigBtn");
      }

      _bindEvents() {
        this.toggleBtn.addEventListener("click", () => this.open());
        this.closeBtn.addEventListener("click", () => this.close());
        this.modal.addEventListener("click", (e) => {
          if (e.target === this.modal) this.close();
        });
        this.saveBtn.addEventListener("click", () => this._handleSave());
      }

      open() {
        const saved = Cookie.get(this.cookieName);
        if (saved) {
          this.textarea.value = saved;
        }
        this.modal.classList.remove("hidden");
      }

      close() {
        this.modal.classList.add("hidden");
      }

      _applyConfig(rawText) {
        try {
          const parsed = JSON.parse(rawText);
          window[this.globalKey] = parsed;
          return true;
        } catch (error) {
          console.error("ConfigManager: Invalid JSON format.", error);
          alert("Invalid JSON format. Please check your syntax.");
          return false;
        }
      }

      _handleSave() {
        const rawText = this.textarea.value.trim();
        if (!rawText) {
          alert("Configuration cannot be empty.");
          return;
        }
        if (!this._applyConfig(rawText)) return;
        Cookie.set(this.cookieName, rawText, 365);
        this.close();
      }

      _checkInitialCookie() {
        const saved = Cookie.get(this.cookieName);
        if (saved) {
          this.textarea.value = saved;
          this._applyConfig(saved);
        }
      }
    }
  </script>

  <script type="module">
    import { FileManager } from "./js/file.js";
    import { FileAdapterService } from "./js/service.js";

    const configManager = new ConfigManager("toggleConfigBtn");

    // Directly render the Folder view into appContent
    document.getElementById("appContent").innerHTML = `
      <div class="bg-white text-slate-800 rounded-2xl shadow-2xl border border-slate-200 w-full max-w-6xl h-[90vh] flex flex-col overflow-hidden">
        <!-- Header -->
        <div class="bg-slate-50 px-5 py-3 border-b border-slate-200 flex items-center justify-between gap-4 shrink-0">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center text-lg shadow-inner">
              <i class="fa-solid fa-folder-tree"></i>
            </div>
            <div>
              <h3 class="text-sm font-bold text-slate-900">System Folder Manager</h3>
            </div>
          </div>

          <div class="flex items-center gap-2">
            <label class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-2 shadow-sm cursor-pointer">
              <i class="fa-solid fa-folder-plus"></i> Select Folder
              <input type="file" class="widget-folder-input-header hidden" webkitdirectory directory multiple>
            </label>
            <button type="button" class="widget-close-btn text-slate-400 hover:text-slate-700 text-xl px-2 py-1 transition ml-2 cursor-pointer">&times;</button>
          </div>
        </div>

        <!-- Main Content Container assigned to FileManager -->
        <div id="widget-browser-wrapper" class="flex-1 bg-slate-50 overflow-hidden flex flex-col min-h-0 relative">
          <!-- Full-Screen Dropzone -->
          <div class="widget-select-screen flex-1 bg-white hover:bg-blue-50/20 transition-all p-8 flex flex-col items-center justify-center text-center relative cursor-pointer group border-2 border-dashed border-slate-200 hover:border-blue-500">
            <input type="file" class="widget-folder-input-main absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20" webkitdirectory directory multiple>
            <div class="pointer-events-none flex flex-col items-center justify-center">
              <div class="w-20 h-20 bg-blue-50 text-blue-600 rounded-3xl flex items-center justify-center text-3xl group-hover:scale-105 transition-transform mb-4 shadow-inner">
                <i class="fa-solid fa-folder-open"></i>
              </div>
              <h4 class="text-sm font-bold text-slate-800 mb-1">Click anywhere to select a folder</h4>
              <p class="text-xs text-slate-400 max-w-sm">Loads directory layout with instant previews and computed folder sizes.</p>
            </div>
          </div>
        </div>
      </div>
    `;

    const service = new FileAdapterService();
    let folderManager = null;

    document.querySelectorAll('.widget-folder-input-main, .widget-folder-input-header').forEach(input => {
      input.addEventListener('change', async (e) => {
        if (folderManager == null) {
          folderManager = new FileManager({
            containerId: 'widget-browser-wrapper',
            service: service
          });
          folderManager.init();
        }
        const files = e.target.files;
        if (!files || files.length === 0) return;
        console.log(files);
        await folderManager.switch(files);
        console.log(`Loaded ${files.length} items successfully via service switch!`);
      });
    });
  </script>
</body>
</html>
