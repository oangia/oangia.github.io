<!DOCTYPE html>
<html lang="en"> 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Manager</title>
  <script src="/js/utils.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/omggif@1.0.10/omggif.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">
  <!-- Main Workspace Layout -->
  <div class="flex-1 flex overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-800 text-slate-300 border-r border-slate-700 flex flex-col shrink-0">
      <div class="p-4 border-b border-slate-700 text-xs font-semibold tracking-wider text-slate-400 uppercase">
        Navigation
      </div>
      <nav class="p-3 space-y-1 flex-1">
        <button id="navHome" class="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition bg-blue-600 text-white">
          <i class="fa-solid fa-house text-base"></i>
          <span>Home</span>
        </button>
        <button id="navFile" class="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition text-slate-300 hover:bg-slate-700 hover:text-white">
          <i class="fa-solid fa-folder text-base"></i>
          <span>File</span>
        </button>
        <button id="navMemo" class="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition text-slate-300 hover:bg-slate-700 hover:text-white">
          <i class="fa-solid fa-note-sticky text-base"></i>
          <span>Memo</span>
        </button>
        <button id="navCode" class="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition text-slate-300 hover:bg-slate-700 hover:text-white">
          <i class="fa-solid fa-code text-base"></i>
          <span>Code</span>
        </button>
        <button id="navJav" class="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition text-slate-300 hover:bg-slate-700 hover:text-white">
          <i class="fa-solid fa-video text-base"></i>
          <span>Jav</span>
        </button>
      </nav>
    </aside>

    <!-- Content Area Container -->
    <main id="appContent" class="flex-1 flex flex-col bg-slate-50 p-4 overflow-y-auto custom-scrollbar">
    </main>
  </div>

  <script type="module">
    import { FirebaseService, ConfigManager } from "./js/firebase-service.js";
    import { FileManager } from "./js/file/manager.js";
    import { FileBackup } from "./js/file/backup.js";
    
    const fbService = new FirebaseService();

    const collectionConfigs = {
      file: {
        title: "File Manager - File",
        filesCollection: "book_files",
        fileChunksCollection: "book_file_chunks"
      },
      memo: {
        title: "File Manager - Memo",
        filesCollection: "memo_files",
        fileChunksCollection: "memo_file_chunks"
      },
      code: {
        title: "File Manager - Code",
        filesCollection: "code_files",
        fileChunksCollection: "code_file_chunks"
      },
      jav: {
        title: "File Manager - Jav",
        filesCollection: "jav_files",
        fileChunksCollection: "jav_file_chunks"
      }
    };

    let activeSpace = "home";

    // Initialize FileManager instance ONCE
    const fileManager = new FileManager({
      containerId: "appContent",
      fbService: fbService,
      filesCollection: collectionConfigs.file.filesCollection,
      fileChunksCollection: collectionConfigs.file.fileChunksCollection
    });

    function renderHome() {
      const container = document.getElementById("appContent");
      container.innerHTML = `
        <div class="max-w-4xl mx-auto p-6 space-y-6">
          <h1 class="text-2xl font-bold text-slate-800">Welcome to Home</h1>
          <p class="text-slate-600">This is the home page dashboard.</p>
        </div>
      `;
    }

    function switchSpace(spaceKey) {
      activeSpace = spaceKey;
      
      const buttons = {
        home: document.getElementById("navHome"),
        file: document.getElementById("navFile"),
        memo: document.getElementById("navMemo"),
        code: document.getElementById("navCode"),
        jav: document.getElementById("navJav")
      };

      Object.keys(buttons).forEach((key) => {
        if (key === spaceKey) {
          buttons[key].className = "sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition bg-blue-600 text-white";
        } else {
          buttons[key].className = "sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition text-slate-300 hover:bg-slate-700 hover:text-white";
        }
      });

      if (spaceKey === "home") {
        document.getElementById("appTitle").textContent = "File Manager - Home";
        renderHome();
      } else {
        const config = collectionConfigs[spaceKey];
        document.getElementById("appTitle").textContent = config.title;
        document.getElementById("appContent").innerHTML = `<div id="fileManagerApp" class="w-full h-full flex flex-col"></div>`;
        fileManager.containerId = "fileManagerApp";
        fileManager.init();
        fileManager.switch({
          items: config.filesCollection,
          fileChunks: config.fileChunksCollection
        });
        window.fileManager = fileManager;
      }
    }

    // Navigation Listeners
    document.getElementById("navHome").addEventListener("click", () => {
      if (activeSpace !== "home") switchSpace("home");
    });

    document.getElementById("navFile").addEventListener("click", () => {
      if (activeSpace !== "file") switchSpace("file");
    });

    document.getElementById("navMemo").addEventListener("click", () => {
      if (activeSpace !== "memo") switchSpace("memo");
    });

    document.getElementById("navCode").addEventListener("click", () => {
      if (activeSpace !== "code") switchSpace("code");
    });

    document.getElementById("navJav").addEventListener("click", () => {
      if (activeSpace !== "jav") switchSpace("jav");
    });

    new AppHeader({
      title: "File Manager - Home",
      subtitle: "Fast On-Demand Loading & Chunked Storage",
      icon: "fa-solid fa-folder-tree",
      iconBg: "bg-blue-500 text-white",
      status: { text: "Status", color: "amber" },
      actionButton: { 
        id: "toggleConfigBtn", 
        text: "Config", 
        icon: "fa-solid fa-gear" 
      }
    }).mount();

    const configManager = new ConfigManager("toggleConfigBtn");
    
    switchSpace(activeSpace);
    
    import { DailyTaskTracker } from "./js/widget/tracker.js";
    import { PdfExtractorWidget } from './js/widget/pdf.js';
    import { MediaFrameExtractorWidget } from './js/widget/image.js';
    import { PhotoshopWidget } from './js/widget/pts.js';
    import { GithubWidget } from "./js/widget/git.js";
    import { FileManagerWidget } from "./js/widget/file.js";
    
    new MediaFrameExtractorWidget();
    new PhotoshopWidget();
    new PdfExtractorWidget();
    new FileManagerWidget();
    new GithubWidget();
    new DailyTaskTracker({
      Music: ['Learn/write songs', 'Practice singing'],
      Basic: ['Exercises', 'Reading', 'Learn an expression', 'Diet']     
    });
  </script>
</body>
</html>
