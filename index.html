<!DOCTYPE html>
<html lang="en" class="bg-black text-slate-100 h-full w-full overflow-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase Storage File Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.2) !important; 
      color: #f8fafc;
    }
    #searchInput::placeholder,
    input::placeholder {
      color: rgba(148, 163, 184, 0.7);
    }
    .thumb, .thumb-video {
      width: 36px;
      height: 36px;
      object-fit: cover;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }
    #editTextarea {
      width: 100%;
      min-height: 55vh;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 13px;
      line-height: 1.5;
      padding: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 0.5rem;
      resize: vertical;
      background: rgba(15, 23, 42, 0.85);
      color: #f8fafc;
      outline: none;
    }
    #editTextarea:focus {
      border-color: #818cf8;
    }
    /* Subtle dark scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.35);
    }
  </style>
</head>
<body class="bg-black text-slate-100 h-screen w-screen flex flex-col font-sans antialiased overflow-hidden m-0 p-0">

  <!-- Toast Container -->
  <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col space-y-3 pointer-events-none max-w-sm w-full px-4 sm:px-0"></div>

  <!-- Full-Width Header -->
  <header class="w-full border-b border-white/15 px-6 py-3 flex flex-wrap items-center justify-between gap-4 shrink-0">
    <div class="flex items-center space-x-3 shrink-0">
      <div class="bg-indigo-500/10 border border-indigo-400/50 text-indigo-400 p-2 rounded-xl flex items-center justify-center">
        <i class="fa-solid fa-cloud text-lg"></i>
      </div>
      <div>
        <h1 class="font-bold text-base text-white leading-tight">Supabase Storage Explorer</h1>
        <p class="text-xs font-mono text-slate-400 mt-0.5" id="headerUrl">Not connected</p>
      </div>
    </div>

    <!-- Header Controls (Search, Actions & Tab Switcher) -->
    <div class="flex flex-wrap items-center gap-2.5 mr-12">
      <!-- Explorer Action Controls -->
      <div id="headerActionControls" class="flex flex-wrap items-center gap-2.5">
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
            <i class="fa-solid fa-magnifying-glass text-xs"></i>
          </span>
          <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search files..." 
                 class="pl-9 pr-4 py-1.5 bg-white/5 border border-white/20 text-white rounded-lg text-xs focus:outline-none focus:border-indigo-400 focus:bg-white/10 w-44 sm:w-56 transition">
        </div>

        <button onclick="openCreateFolderModal()" class="px-3 py-1.5 bg-white/5 hover:bg-white/10 border border-white/20 hover:border-amber-400/70 text-slate-200 hover:text-white text-xs font-semibold rounded-lg flex items-center space-x-1.5 transition">
          <i class="fa-solid fa-folder-plus text-amber-400"></i>
          <span>New Folder</span>
        </button>

        <button onclick="createBackup()" id="backupBtn" class="px-3 py-1.5 bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-400/50 hover:border-emerald-400 text-emerald-200 hover:text-white text-xs font-semibold rounded-lg flex items-center space-x-1.5 transition">
          <i class="fa-solid fa-box-archive text-emerald-400"></i>
          <span>Backup</span>
        </button>

        <div class="relative">
          <button onclick="toggleUploadMenu()" class="px-3 py-1.5 bg-indigo-500/15 hover:bg-indigo-500/25 border border-indigo-400/60 hover:border-indigo-400 text-indigo-200 hover:text-white text-xs font-semibold rounded-lg flex items-center space-x-1.5 transition">
            <i class="fa-solid fa-upload text-indigo-400"></i>
            <span>Upload</span>
            <i class="fa-solid fa-chevron-down text-[10px] ml-1 text-indigo-300"></i>
          </button>
          
          <div id="uploadMenu" class="hidden absolute right-0 mt-1.5 w-48 bg-zinc-900/95 border border-white/20 shadow-xl shadow-black/80 backdrop-blur-md rounded-xl py-1 z-30 text-slate-200">
            <label class="flex items-center px-4 py-2 text-xs hover:bg-white/10 hover:text-white cursor-pointer transition">
              <i class="fa-solid fa-file mr-2.5 text-indigo-400"></i>
              <span>Upload File(s)</span>
              <input type="file" id="localFileUpload" multiple onchange="handleFileUpload(event, false)" class="hidden">
            </label>
            <label class="flex items-center px-4 py-2 text-xs hover:bg-white/10 hover:text-white cursor-pointer transition">
              <i class="fa-solid fa-folder-open mr-2.5 text-amber-400"></i>
              <span>Upload Folder</span>
              <input type="file" id="localFolderUpload" webkitdirectory directory multiple onchange="handleFileUpload(event, true)" class="hidden">
            </label>
          </div>
        </div>
      </div>

      <!-- Tab Switcher -->
      <div class="flex items-center space-x-1.5 bg-white/5 border border-white/10 p-1 rounded-lg">
        <button onclick="switchTab('explorer')" id="navExplorerTab" class="px-3 py-1 text-xs font-semibold text-white bg-white/10 rounded-md border border-white/30 transition">Explorer</button>
        <button onclick="switchTab('settings')" id="navSettingsTab" class="px-3 py-1 text-xs font-semibold text-slate-400 hover:text-white rounded-md border border-transparent hover:border-white/20 transition">Settings</button>
      </div>
    </div>
  </header>

  <!-- Full-Width Main Canvas -->
  <main class="flex-1 w-full h-full overflow-hidden flex flex-col bg-transparent m-0 p-0">

    <!-- Explorer View -->
    <div id="viewExplorer" class="flex-1 w-full h-full flex flex-col overflow-hidden bg-transparent">

      <!-- Breadcrumb Bar -->
      <div class="w-full px-6 py-2.5 border-b border-white/15 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-2 text-sm text-slate-200">
          <nav id="breadcrumbNav" class="flex items-center space-x-2"></nav>
        </div>
      </div>

      <!-- Edge-to-Edge Grid Area -->
      <div class="flex-1 w-full overflow-y-auto p-6 bg-transparent">
        <div id="itemsGrid"></div>
      </div>

      <!-- Footer -->
      <div class="w-full px-6 py-2.5 border-t border-white/15 flex items-center justify-between text-xs text-slate-400 shrink-0">
        <div id="connectionStatus" class="flex items-center space-x-2">
          <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse" id="statusDot"></span>
          <span id="statusText" class="text-slate-300">Not connected</span>
        </div>
        <div id="itemCountLabel">0 item(s)</div>
      </div>
    </div>

    <!-- Settings View -->
    <div id="viewSettings" class="hidden flex-1 w-full h-full flex flex-col overflow-y-auto p-6 bg-transparent">
      <div class="max-w-4xl w-full mx-auto bg-zinc-900/0 border border-white/15 backdrop-blur-md rounded-2xl p-6 space-y-6 my-auto shadow-2xl">
        <div class="border-b border-white/10 pb-4">
          <h2 class="text-lg font-bold text-white mb-1">Configuration</h2>
          <p class="text-xs text-slate-400">Enter your Supabase and Firebase credentials.</p>
        </div>
    
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <!-- Supabase Card -->
          <div class="bg-black/20 border border-white/10 p-4 rounded-xl space-y-4">
            <h3 class="font-semibold text-sm text-white flex items-center gap-2">
              <i class="fa-solid fa-bolt text-emerald-400"></i> Supabase Credentials
            </h3>
            
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Project URL</label>
              <input type="text" name="sb_url" placeholder="https://xxxxx.supabase.co" 
                     class="w-full px-3 py-2 bg-white/5 border border-white/20 text-white rounded-lg text-xs font-mono focus:outline-none focus:border-indigo-400">
            </div>
    
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Anon Public Key</label>
              <input type="text" name="sb_key" placeholder="eyJhbGciOiJIUzI1NiIsIn..." 
                     class="w-full px-3 py-2 bg-white/5 border border-white/20 text-white rounded-lg text-xs font-mono focus:outline-none focus:border-indigo-400">
            </div>
    
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Storage Bucket Name</label>
              <input type="text" name="sb_bucket" placeholder="files" value="files" data-default="files"
                     class="w-full px-3 py-2 bg-white/5 border border-white/20 text-white rounded-lg text-xs font-mono focus:outline-none focus:border-indigo-400">
            </div>
          </div>
    
          <!-- Firebase Card -->
          <div class="bg-black/20 border border-white/10 p-4 rounded-xl space-y-4">
            <h3 class="font-semibold text-sm text-white flex items-center gap-2">
              <i class="fa-solid fa-fire text-amber-400"></i> Firebase Credentials
            </h3>
    
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Firebase API Key (<code class="text-[11px] text-indigo-300">apiKey</code>)</label>
              <input type="text" name="fb_apikey" placeholder="AIzaSy..." 
                     class="w-full px-3 py-2 bg-white/5 border border-white/20 text-white rounded-lg text-xs font-mono focus:outline-none focus:border-indigo-400">
            </div>
    
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Project ID (<code class="text-[11px] text-indigo-300">projectId</code>)</label>
              <input type="text" name="fb_projectid" placeholder="my-firebase-project" 
                     class="w-full px-3 py-2 bg-white/5 border border-white/20 text-white rounded-lg text-xs font-mono focus:outline-none focus:border-indigo-400">
            </div>
    
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">App ID (<code class="text-[11px] text-indigo-300">appId</code>)</label>
              <input type="text" name="fb_appid" placeholder="1:123456789:web:abc123" 
                     class="w-full px-3 py-2 bg-white/5 border border-white/20 text-white rounded-lg text-xs font-mono focus:outline-none focus:border-indigo-400">
            </div>
          </div>
        </div>
    
        <div class="pt-2">
          <button onclick="saveSettings()" class="px-5 py-2 bg-indigo-500/20 hover:bg-indigo-500/30 border border-indigo-400 text-white text-xs font-semibold rounded-lg transition">
            Save & Connect
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Create Folder Modal -->
  <div id="modalCreateFolder" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-transparent p-4">
    <div class="bg-zinc-900/80 border border-white/20 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
      <h3 class="font-bold text-base text-white">Create New Folder</h3>
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Folder Name</label>
        <input type="text" id="folderNameInput" placeholder="e.g. documents" 
               class="w-full px-3 py-2 bg-white/5 border border-white/20 text-white rounded-lg text-xs focus:outline-none focus:border-indigo-400">
      </div>
      <div class="flex justify-end space-x-2 pt-2">
        <button onclick="closeModals()" class="px-4 py-2 bg-white/5 hover:bg-white/10 text-slate-300 hover:text-white text-xs font-semibold rounded-lg transition">Cancel</button>
        <button onclick="submitCreateFolder()" class="px-4 py-2 bg-indigo-500/20 hover:bg-indigo-500/30 border border-indigo-400 text-white text-xs font-semibold rounded-lg transition">Create Folder</button>
      </div>
    </div>
  </div>

  <!-- Preview / Editor & Sidebar Modal -->
  <div id="modalPreview" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/20 p-0 m-0">
    <div class="w-screen h-screen flex flex-col overflow-hidden m-0 p-0 text-slate-100">
      
      <!-- Top Bar -->
      <div class="flex items-center justify-between px-6 py-3.5 border-b border-white/15 bg-black/40 shrink-0">
        <h3 id="previewTitle" class="font-bold text-sm text-white truncate"></h3>
        <button onclick="closeModals()" class="text-slate-400 hover:text-white p-1 text-lg transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
  
      <!-- Content Container: Split Screen (Left: Viewer, Right: Sidebar) -->
      <div class="flex-1 flex overflow-hidden bg-transparent">
        
        <!-- Main Preview Area -->
        <div id="previewBody" class="flex-1 overflow-auto flex items-center justify-center"></div>
  
        <!-- Right Sidebar for Details & Hashes -->
        <div class="w-80 border-l border-white/15 bg-zinc-950/60 flex flex-col overflow-y-auto p-4 shrink-0">
          <div class="flex items-center gap-2 pb-3 mb-3 border-b border-white/15">
            <i class="fa-solid fa-fingerprint text-indigo-400 text-sm"></i>
            <h4 class="font-bold text-xs uppercase tracking-wider text-slate-200">File Details & Hashes</h4>
          </div>
          <div id="previewSidebarDetails" class="space-y-4 text-xs text-slate-300">
            <!-- Dynamic Hashes injected here -->
          </div>
        </div>
  
      </div>
  
      <!-- Footer Buttons -->
      <div class="px-6 py-3.5 border-t border-white/15 bg-black/40 flex justify-end gap-2 flex-wrap shrink-0">
        <button id="previewSaveBtn" onclick="saveEditedText()" class="hidden px-4 py-2 bg-emerald-500/15 hover:bg-emerald-500/25 border border-emerald-400 text-emerald-200 hover:text-white text-xs font-semibold rounded-lg transition">
          <i class="fa-solid fa-floppy-disk mr-1 text-emerald-400"></i> Save
        </button>
        <button id="previewCancelEditBtn" onclick="cancelEditText()" class="hidden px-4 py-2 bg-white/5 hover:bg-white/10 text-slate-300 hover:text-white text-xs font-semibold rounded-lg transition">
          Cancel
        </button>
        <a id="previewDownloadBtn" href="#" download class="px-4 py-2 bg-indigo-500/15 hover:bg-indigo-500/25 border border-indigo-400 text-indigo-200 hover:text-white text-xs font-semibold rounded-lg transition">
          <i class="fa-solid fa-download mr-1 text-indigo-400"></i> Download
        </a>
        <button onclick="closeModals()" class="px-4 py-2 bg-white/5 hover:bg-white/10 border border-white/15 text-slate-300 hover:text-white text-xs font-semibold rounded-lg transition">Close</button>
      </div>
  
    </div>
  </div>

  <script src="./backup.js"></script>
  <script src="./interface.js"></script>
</body>
</html>
