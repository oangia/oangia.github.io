<!DOCTYPE html>
<html lang="en"> 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Manager</title>
  <script src="/js/utils.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style id="customScrollbarStyle">
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/omggif@1.0.10/omggif.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">
  <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-30 w-full">
    <div class="max-w-8xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4 w-full">
      <!-- Logo & Titles -->
      <div class="flex items-center space-x-3">
        <div class="bg-blue-500 text-white p-2 rounded-xl shadow-md">
          <i class="fa-solid fa-folder-tree text-lg"></i>
        </div>
        <div>
          <h1 id="appTitle" class="text-lg font-bold tracking-tight">File Manager - Home</h1>
          <p class="text-[11px] text-slate-400">Fast On-Demand Loading &amp; Chunked Storage</p>
        </div>
      </div>

      <!-- Status & Action Button -->
      <div class="flex items-center space-x-3">  
        <button id="toggleConfigBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-xl text-xs transition flex items-center gap-2 border border-slate-700">
          <i class="fa-solid fa-gear"></i>
          <span>Config</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Workspace Layout -->
  <div class="flex-1 flex overflow-hidden">
    <!-- Sidebar Container -->
    <div id="sidebarContainer"></div>

    <!-- Content Area Container -->
    <main id="appContent" class="flex-1 flex flex-col bg-slate-50 p-4 overflow-y-auto custom-scrollbar">
    </main>
  </div>

  <script type="module">
    import { FirebaseService } from "./js/firebase-service.js";
    import { FileManagerWrapper } from "./js/file/manager.js";
    
    const configManager = new ConfigManager("toggleConfigBtn");
    const fbService = new FirebaseService();
    
    // Initialize FileManager instance ONCE
    const fileManager = new FileManagerWrapper({
      containerId: "appContent",
      fbService: fbService
    });

    const collectionConfigs = {
      file: {
        title: "File Manager - File",
        filesCollection: "book_files",
        fileChunksCollection: "book_file_chunks"
      },
      memo: {
        title: "File Manager - Memo",
        filesCollection: "memo_files",
        fileChunksCollection: "memo_file_chunks"
      }
    };

    function switchSpace(spaceKey) {
      if (spaceKey === "home") {
        document.getElementById("appTitle").textContent = "File Manager - Home";
        document.getElementById("appContent").innerHTML = `
          <div class="max-w-4xl mx-auto p-6 space-y-6">
            <h1 class="text-2xl font-bold text-slate-800">Welcome to Home</h1>
            <p class="text-slate-600">This is the home page dashboard.</p>
          </div>
        `;
      } else {
        const config = collectionConfigs[spaceKey];
        document.getElementById("appTitle").textContent = config.title;
        document.getElementById("appContent").innerHTML = `<div id="fileManagerApp" class="w-full h-full flex flex-col"></div>`;
        fileManager.containerId = "fileManagerApp";
        fileManager.init();
        fileManager.switch({
          items: config.filesCollection,
          fileChunks: config.fileChunksCollection
        });
        window.fileManager = fileManager;
      }
    }

    // Khởi tạo Sidebar Class
    const sidebar = new Sidebar({
      containerId: "sidebarContainer",
      activeSpace: "home",
      items: [
        { id: "navHome", spaceKey: "home", label: "Home", icon: "fa-solid fa-house" },
        { id: "navFile", spaceKey: "file", label: "File", icon: "fa-solid fa-folder" },
        { id: "navMemo", spaceKey: "memo", label: "Memo", icon: "fa-solid fa-note-sticky" }
      ],
      onSelect: (spaceKey) => {
        switchSpace(spaceKey);
      }
    });
    // Render ban đầu
    switchSpace("home");
  </script>
  <script type="module">import "./js/widget/widget.js";</script>
</body>
</html>
