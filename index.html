<!DOCTYPE html>
<html lang="en" class="bg-black/30 text-slate-100 h-full w-full overflow-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase Storage File Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    #searchInput::placeholder,
    input::placeholder {
      color: rgba(148, 163, 184, 0.7);
    }
    .thumb, .thumb-video {
      width: 36px;
      height: 36px;
      object-fit: cover;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }
    #editTextarea {
      width: 100%;
      min-height: 55vh;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 13px;
      line-height: 1.5;
      padding: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 0.5rem;
      resize: vertical;
      background: rgba(15, 23, 42, 0.85);
      color: #f8fafc;
      outline: none;
    }
    #editTextarea:focus {
      border-color: #818cf8;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.35);
    }
  </style>
</head>
<body class="text-slate-100 h-screen w-screen flex flex-col font-sans antialiased overflow-hidden m-0 p-0">

  <!-- Toast Container -->
  <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col space-y-3 pointer-events-none max-w-sm w-full px-4 sm:px-0"></div>

  <!-- Header -->
  <header class="w-full border-b border-white/15 px-6 py-3 flex items-center justify-between gap-4 shrink-0">
    <!-- Left -->
    <div class="flex items-center space-x-3 shrink-0">
      <div class="bg-indigo-500/10 border border-indigo-400/50 text-indigo-400 p-2 rounded-xl flex items-center justify-center">
        <i class="fa-solid fa-cloud text-lg"></i>
      </div>
      <div>
        <h1 class="font-bold text-base text-white leading-tight">Storage</h1>
      </div>
    </div>

    <!-- Center: Search -->
    <div class="flex-1 max-w-md mx-6">
      <div class="relative w-full">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
          <i class="fa-solid fa-magnifying-glass text-xs"></i>
        </span>
        <input type="text" id="searchInput" placeholder="Search files..." 
               class="w-full pl-9 pr-4 py-1.5 bg-white/5 border border-white/20 text-white rounded-lg text-xs focus:outline-none focus:border-indigo-400 focus:bg-white/10 transition">
      </div>
    </div>

    <!-- Right -->
    <div class="flex items-center gap-2.5 shrink-0">
      <div id="headerActionControls" class="flex items-center gap-2.5">
        <button id="authBtn" class="px-4 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-xs font-bold text-white transition cursor-pointer shadow-sm">
          <i class="fa-solid fa-right-to-bracket mr-1.5"></i>Connect Drive
        </button>
        <div class="relative">
          <button id="actionsMenu" class="px-3 py-1.5 bg-indigo-500/15 hover:bg-indigo-500/25 border border-indigo-400/60 hover:border-indigo-400 text-indigo-200 hover:text-white text-xs font-semibold rounded-lg flex items-center space-x-1.5 transition">
            <i class="fa-solid fa-plus text-indigo-400"></i>
            <span>Actions</span>
            <i class="fa-solid fa-chevron-down text-[10px] ml-1 text-indigo-300"></i>
          </button>
          
          <div id="actionsMenuToggleBtn" class="hidden absolute right-0 mt-1.5 w-56 bg-zinc-900/95 border border-white/20 shadow-xl shadow-black/80 backdrop-blur-md rounded-xl py-1 z-30 text-slate-200">
            <label class="w-full text-left flex items-center px-4 py-2 text-xs hover:bg-white/10 hover:text-white cursor-pointer transition">
              <i class="fa-solid fa-file mr-2.5 text-indigo-400 w-4"></i>
              <span>Upload File(s)</span>
              <input type="file" id="fileUpload" multiple class="hidden">
            </label>

            <!-- Added: Encrypted File Upload -->
            <label class="w-full text-left flex items-center px-4 py-2 text-xs hover:bg-white/10 hover:text-white cursor-pointer transition">
              <i class="fa-solid fa-file-shield mr-2.5 text-purple-400 w-4"></i>
              <span>Upload File (Encrypt)</span>
              <input type="file" id="encryptedFileUpload" multiple class="hidden">
            </label>

            <label class="w-full text-left flex items-center px-4 py-2 text-xs hover:bg-white/10 hover:text-white cursor-pointer transition">
              <i class="fa-solid fa-folder-open mr-2.5 text-amber-400 w-4"></i>
              <span>Upload Folder</span>
              <input type="file" id="folderUpload" webkitdirectory directory multiple class="hidden">
            </label>

            <div class="border-t border-white/10 my-1"></div>

            <button id="openCreateFolderModalBtn" class="w-full text-left flex items-center px-4 py-2 text-xs hover:bg-white/10 hover:text-white transition">
              <i class="fa-solid fa-folder-plus mr-2.5 text-amber-400 w-4"></i>
              <span>New Folder</span>
            </button>

            <button id="openLocalFolderBtn" class="w-full text-left flex items-center px-4 py-2 text-xs hover:bg-white/10 hover:text-white transition">
              <i class="fa-solid fa-folder text-emerald-400 mr-2.5 w-4"></i>
              <span>Folder</span>
            </button>

            <button id="backupBtn" class="w-full text-left flex items-center px-4 py-2 text-xs hover:bg-white/10 hover:text-white transition">
              <i class="fa-solid fa-box-archive mr-2.5 text-emerald-400 w-4"></i>
              <span>Backup</span>
            </button>

            <div class="border-t border-white/10 my-1"></div>

            <button id="navSettingsTab" class="w-full text-left flex items-center px-4 py-2 text-xs hover:bg-white/10 hover:text-white transition">
              <i class="fa-solid fa-gear mr-2.5 text-emerald-400 w-4"></i>
              <span>Settings</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 w-full h-full overflow-hidden flex flex-col bg-transparent m-0 p-0">
    <div id="viewExplorer" class="flex-1 w-full h-full flex flex-col overflow-hidden bg-transparent">
      <!-- Breadcrumb -->
      <div class="w-full px-6 py-2.5 border-b border-white/15 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-2 text-sm text-slate-200">
          <nav id="breadcrumbNav" class="flex items-center space-x-2"></nav>
        </div>
      </div>

      <!-- Grid -->
      <div class="flex-1 w-full overflow-y-auto p-6 bg-transparent">
        <div id="itemsGrid"></div>
      </div>

      <!-- Footer -->
      <div class="w-full px-6 py-2.5 border-t border-white/15 flex items-center justify-between text-xs text-slate-400 shrink-0">
        <div id="itemCountLabel">0 item(s)</div>
      </div>
    </div>
  </main>
  <script src="./file/service/supa.js"></script>
  <script src="./file/service/local.js"></script>
  <script src="./file/service/drive.js"></script>
  <script src="./file/record.js"></script>
  <script src="./file/file.js"></script>
  <script>    
    set_bg();
  </script>
</body>
</html>
