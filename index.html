<!DOCTYPE html>
<html lang="en"> 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Folder Manager Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/omggif@1.0.10/omggif.min.js"></script>
  <style>
    /* Desktop App Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    
    /* Native App Select Prevention & Smoothing */
    body {
      user-select: none;
      -webkit-font-smoothing: antialiased;
      background-color: #0f172a;
    }
    input, textarea { user-select: text; }
  </style>
</head>
<body class="text-slate-200 font-sans h-screen w-screen flex flex-col overflow-hidden m-0 p-0">

  <!-- Desktop App Title Bar / Header -->
  <header class="bg-slate-950 text-slate-400 h-10 px-4 flex items-center justify-between border-b border-slate-800 shrink-0 select-none">
    <div class="flex items-center space-x-2.5">
      <div class="w-3 h-3 rounded-full bg-rose-500/80 hover:bg-rose-600 cursor-pointer flex items-center justify-center text-[8px] text-slate-950 font-bold"></div>
      <div class="w-3 h-3 rounded-full bg-amber-500/80 hover:bg-amber-600 cursor-pointer flex items-center justify-center text-[8px] text-slate-950 font-bold"></div>
      <div class="w-3 h-3 rounded-full bg-emerald-500/80 hover:bg-emerald-600 cursor-pointer flex items-center justify-center text-[8px] text-slate-950 font-bold"></div>
      <span class="text-xs font-semibold text-slate-400 pl-2 border-l border-slate-800">Folder Manager Studio</span>
    </div>

    <!-- App Actions / Status -->
    <div class="flex items-center space-x-3">
      <label class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded text-xs font-medium transition flex items-center gap-1.5 shadow-sm cursor-pointer">
        <i class="fa-solid fa-folder-plus"></i> Open Directory
        <input type="file" class="widget-folder-input-header hidden" webkitdirectory directory multiple>
      </label>
    </div>
  </header>

  <!-- Main Application Workspace (IDE / Desktop Software Layout) -->
  <div class="flex-1 flex overflow-hidden bg-slate-900">
    
    <!-- Left Sidebar / Tool Panel -->
    <aside class="w-64 bg-slate-950 border-r border-slate-800 flex flex-col shrink-0">
      <div class="p-3 text-[11px] font-bold uppercase tracking-wider text-slate-500 border-b border-slate-900 flex items-center justify-between">
        <span>Explorer</span>
        <i class="fa-solid fa-ellipsis-vertical text-slate-600"></i>
      </div>
      <div class="flex-1 p-3 text-xs text-slate-500 flex flex-col items-center justify-center text-center">
        <i class="fa-regular fa-folder-open text-3xl mb-2 text-slate-700"></i>
        <span>No workspace loaded</span>
      </div>
    </aside>

    <!-- Center Workspace Area -->
    <main id="widget-browser-wrapper" class="flex-1 bg-slate-900 flex flex-col relative overflow-hidden">
      <!-- Full-Screen Dropzone / Empty State styled like native software -->
      <div class="widget-select-screen flex-1 bg-slate-900 hover:bg-slate-850 transition-all p-8 flex flex-col items-center justify-center text-center relative cursor-pointer group border border-dashed border-slate-800 m-4 rounded-lg">
        <input type="file" class="widget-folder-input-main absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20" webkitdirectory directory multiple>
        <div class="pointer-events-none flex flex-col items-center justify-center">
          <div class="w-16 h-16 bg-slate-800 text-blue-400 rounded-xl flex items-center justify-center text-2xl group-hover:scale-105 transition-transform mb-4 shadow border border-slate-700">
            <i class="fa-solid fa-folder-open"></i>
          </div>
          <h4 class="text-sm font-semibold text-slate-200 mb-1">Open a Folder</h4>
          <p class="text-xs text-slate-400 max-w-sm">Select a local directory to mount computed file sizes and instant previews.</p>
        </div>
      </div>
    </main>

  </div>

  <!-- Status Bar -->
  <footer class="bg-blue-600 text-white h-6 px-3 flex items-center justify-between text-[11px] shrink-0 font-medium select-none">
    <div class="flex items-center space-x-3">
      <span><i class="fa-solid fa-circle text-[8px] text-emerald-300 mr-1"></i> Ready</span>
    </div>
    <div>v1.0.0-desktop</div>
  </footer>

  <script type="module">
    import { FileManager } from "./js/file.js";
    import { FileAdapterService } from "./js/service.js";

    const service = new FileAdapterService();
    let folderManager = null;

    document.querySelectorAll('.widget-folder-input-main, .widget-folder-input-header').forEach(input => {
      input.addEventListener('change', async (e) => {
        if (folderManager == null) {
          folderManager = new FileManager({
            containerId: 'widget-browser-wrapper',
            service: service
          });
          folderManager.init();
        }
        const files = e.target.files;
        if (!files || files.length === 0) return;
        await folderManager.switch(files);
      });
    });
  </script>
</body>
</html>
