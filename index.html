<!DOCTYPE html>
<html lang="en"> 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Folder Manager Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/omggif@1.0.10/omggif.min.js"></script>
  <style>
    /* Native Desktop Scrollbar */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 5px; border: 2px solid #0f172a; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    
    body {
      user-select: none;
      -webkit-font-smoothing: antialiased;
      background-color: #090d16;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    input, textarea { user-select: text; }
  </style>
</head>
<body class="text-slate-200 font-sans h-screen w-screen flex flex-col">

  <!-- Desktop App Window Titlebar -->
  <header class="bg-[#090d16] text-slate-400 h-9 px-3 flex items-center justify-between border-b border-slate-800/80 shrink-0">
    <!-- Window Controls & App Title -->
    <div class="flex items-center space-x-3">
      <div class="flex items-center space-x-1.5 pr-2">
        <div class="w-3 h-3 rounded-full bg-red-500/80 hover:bg-red-600 cursor-pointer"></div>
        <div class="w-3 h-3 rounded-full bg-yellow-500/80 hover:bg-yellow-600 cursor-pointer"></div>
        <div class="w-3 h-3 rounded-full bg-green-500/80 hover:bg-green-600 cursor-pointer"></div>
      </div>
      <span class="text-xs font-medium text-slate-300 tracking-wide border-l border-slate-800 pl-3">Folder Manager Studio</span>
    </div>

    <!-- Quick Action / Open Directory -->
    <div class="flex items-center space-x-2">
      <label class="bg-blue-600 hover:bg-blue-500 text-white px-2.5 py-1 rounded text-[11px] font-medium transition flex items-center gap-1.5 cursor-pointer shadow-sm">
        <i class="fa-solid fa-folder-open text-[10px]"></i> Open Folder...
        <input type="file" class="widget-folder-input-header hidden" webkitdirectory directory multiple>
      </label>
    </div>
  </header>

  <!-- Software Menu Bar -->
  <nav class="bg-[#0f172a] text-slate-300 h-7 px-3 flex items-center space-x-4 border-b border-slate-800 text-[11px] shrink-0">
    <span class="hover:text-white cursor-pointer px-1.5 py-0.5 rounded hover:bg-slate-800">File</span>
    <span class="hover:text-white cursor-pointer px-1.5 py-0.5 rounded hover:bg-slate-800">Edit</span>
    <span class="hover:text-white cursor-pointer px-1.5 py-0.5 rounded hover:bg-slate-800">View</span>
    <span class="hover:text-white cursor-pointer px-1.5 py-0.5 rounded hover:bg-slate-800">Help</span>
  </nav>

  <!-- Main Software Workspace (Split Pane Layout) -->
  <div class="flex-1 flex overflow-hidden bg-[#090d16]">
    
    <!-- Left Sidebar (File Explorer Tree Pane) -->
    <aside class="w-60 bg-[#0b101d] border-r border-slate-800/80 flex flex-col shrink-0">
      <div class="px-3 py-2 text-[10px] font-bold uppercase tracking-wider text-slate-400 border-b border-slate-800/60 flex items-center justify-between">
        <span>Explorer</span>
        <div class="flex items-center space-x-2 text-slate-400">
          <label class="cursor-pointer hover:text-white"><i class="fa-solid fa-plus text-xs"></i><input type="file" class="widget-folder-input-header hidden" webkitdirectory directory multiple></label>
          <i class="fa-solid fa-ellipsis text-xs"></i>
        </div>
      </div>
      <div class="flex-1 p-4 text-xs text-slate-400 flex flex-col items-center justify-center text-center">
        <i class="fa-solid fa-folder-tree text-3xl mb-2 text-slate-600"></i>
        <p class="font-medium text-slate-300 mb-1">No Folder Open</p>
        <p class="text-[10px] text-slate-400">Open a local workspace directory to begin.</p>
      </div>
    </aside>

    <!-- Center Main Viewport (File Manager Core) -->
    <main id="widget-browser-wrapper" class="flex-1 bg-[#090d16] flex flex-col relative overflow-hidden">
      <!-- Native Dropzone / Initial Empty State -->
      <div class="widget-select-screen flex-1 bg-[#090d16] hover:bg-[#0b101d] transition-all p-8 flex flex-col items-center justify-center text-center relative cursor-pointer group m-4 rounded-lg border border-dashed border-slate-800">
        <input type="file" class="widget-folder-input-main absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20" webkitdirectory directory multiple>
        <div class="pointer-events-none flex flex-col items-center justify-center">
          <div class="w-16 h-16 bg-slate-900 text-blue-400 rounded-xl flex items-center justify-center text-2xl group-hover:scale-105 transition-transform mb-3 shadow border border-slate-800">
            <i class="fa-solid fa-folder-open"></i>
          </div>
          <h4 class="text-xs font-semibold text-slate-200 mb-1">Load Workspace Directory</h4>
          <p class="text-[11px] text-slate-400 max-w-xs">Drag and drop a folder or click anywhere to mount directory tree and chunked storage.</p>
        </div>
      </div>
    </main>

  </div>

  <!-- Software Status Bar -->
  <footer class="bg-blue-600 text-white h-6 px-3 flex items-center justify-between text-[11px] shrink-0 font-medium">
    <div class="flex items-center space-x-3">
      <span class="flex items-center"><i class="fa-solid fa-circle text-[6px] text-emerald-300 mr-1.5"></i> Ready</span>
      <span class="border-l border-blue-500 pl-3">UTF-8</span>
    </div>
    <div class="flex items-center space-x-3">
      <span>Folder Manager v1.0.0</span>
    </div>
  </footer>

  <script type="module">
    import { FileManager } from "./js/file.js";
    import { FileAdapterService } from "./js/service.js";

    const service = new FileAdapterService();
    let folderManager = null;

    document.querySelectorAll('.widget-folder-input-main, .widget-folder-input-header').forEach(input => {
      input.addEventListener('change', async (e) => {
        if (folderManager == null) {
          folderManager = new FileManager({
            containerId: 'widget-browser-wrapper',
            service: service
          });
          folderManager.init();
        }
        const files = e.target.files;
        if (!files || files.length === 0) return;
        await folderManager.switch(files);
      });
    });
  </script>
</body>
</html>
