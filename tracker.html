<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Tasks Tracker</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body class="bg-slate-50 min-h-screen w-full m-0 p-0 font-sans text-slate-800 flex flex-col">
  <!-- Full-Screen App Mount -->
  <div id="task-tracker-app" class="w-full min-h-screen flex flex-col flex-grow"></div>
  <script>
    class DailyTaskTracker {
    constructor(
      tasks = [
        { name: 'Exercises', type: 'daily', priority: 0, section: 'Foundation', objective: 'healthy' },
        { name: 'Reading', type: 'daily', desc: "Try to understand how girls, social, the world work", priority: 2, section: 'Foundation', objective: 'useful' },
        { name: 'Learn songs', type: 'daily', priority: 1, section: 'Music', objective: 'useful' },
        { name: 'Practice singing', type: 'daily', priority: 3, section: 'Music', objective: 'useful' },
        { name: 'Write/sing songs', type: 'daily', priority: 5, desc: "Enjoy life", section: 'Music', objective: 'fun' },
        { name: 'Social', type: 'daily', priority: 4, section: 'Music', objective: 'fun' }
      ],
      title = 'Tasks Tracker',
      options = {}
    ) {
      this.id = options.id || Math.random().toString(36).substring(2, 9);
      this.title = title;
      this.tasks = tasks;
      this.storageKey = options.storageKey || 'daily_tasks_status';
      this.mountSelector = options.mountSelector || '#task-tracker-app';
      
      // Default sort mode is priority
      this.currentSort = 'priority';

      // Objective styles
      this.objectiveColors = {
        healthy: {
          border: 'border-emerald-500',
          bg: 'peer-checked:bg-emerald-600',
          badge: 'text-emerald-700 bg-emerald-50 border border-emerald-200'
        },
        useful: {
          border: 'border-sky-500',
          bg: 'peer-checked:bg-sky-600',
          badge: 'text-sky-700 bg-sky-50 border border-sky-200'
        },
        fun: {
          border: 'border-amber-400',
          bg: 'peer-checked:bg-amber-500',
          badge: 'text-amber-700 bg-amber-50 border border-amber-200'
        },
        default: {
          border: 'border-slate-300',
          bg: 'peer-checked:bg-slate-600',
          badge: 'text-slate-700 bg-slate-50 border border-slate-200'
        }
      };

      this.root = document.querySelector(this.mountSelector) || document.body;
      
      this.createUI();
      this.loadState();
      this.attachEvents();
    }

    createUI() {
      if (this.wrapper) {
        this.wrapper.remove();
      }

      this.wrapper = document.createElement('div');
      this.wrapper.id = this.id;
      this.wrapper.className = 'w-full min-h-screen flex flex-col bg-slate-50';

      const header = document.createElement('header');
      header.className = 'w-full bg-slate-900 text-white px-4 py-2.5 flex flex-wrap justify-between items-center gap-2 shadow-sm sticky top-0 z-10';

      const todayFormatted = new Date().toLocaleDateString(undefined, {
        weekday: 'short',
        month: 'short',
        day: 'numeric'
      });

      header.innerHTML = `
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-md bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
            <i class="fa-solid fa-list-check text-xs"></i>
          </div>
          <div>
            <h1 class="text-xs font-bold tracking-tight">${this.title}</h1>
            <p class="text-[10px] text-slate-400">${todayFormatted}</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <!-- Sort Dropdown -->
          <div class="relative flex items-center">
            <select id="sort-select-${this.id}" class="text-[11px] font-medium bg-slate-800 text-slate-200 border border-slate-700 rounded-md px-2 py-1 outline-none cursor-pointer hover:bg-slate-700 transition">
              <option value="priority" ${this.currentSort === 'priority' ? 'selected' : ''}>Sort: Priority (Default)</option>
              <option value="section" ${this.currentSort === 'section' ? 'selected' : ''}>Sort: Section</option>
              <option value="objective" ${this.currentSort === 'objective' ? 'selected' : ''}>Sort: Objective</option>
              <option value="type" ${this.currentSort === 'type' ? 'selected' : ''}>Sort: Type</option>
            </select>
          </div>
          <div id="progress-badge-${this.id}" class="text-[11px] font-medium px-2.5 py-1 rounded-full bg-slate-800 text-emerald-400 border border-slate-700">
            0 / 0 Completed
          </div>
        </div>
      `;

      const main = document.createElement('main');
      main.className = 'w-full flex-grow px-3 py-4';

      const containerDiv = document.createElement('div');
      containerDiv.className = 'w-full max-w-md mx-auto space-y-3';

      const mainCard = document.createElement('section');
      mainCard.className = 'w-full bg-white rounded-lg border border-slate-200 shadow-sm p-3.5 space-y-4';
      mainCard.id = `main-card-${this.id}`;

      this.renderTaskListContainer(mainCard);

      containerDiv.appendChild(mainCard);
      main.appendChild(containerDiv);

      this.wrapper.appendChild(header);
      this.wrapper.appendChild(main);
      this.root.appendChild(this.wrapper);

      const sortSelect = header.querySelector(`#sort-select-${this.id}`);
      sortSelect.addEventListener('change', (e) => {
        this.currentSort = e.target.value;
        const currentState = this.captureCurrentCheckStates();
        const card = this.wrapper.querySelector(`#main-card-${this.id}`);
        card.innerHTML = '';
        this.renderTaskListContainer(card);
        this.restoreCheckStates(currentState);
        this.attachEvents();
      });
    }

    renderTaskListContainer(mainCard) {
      let tasksCopy = [...this.tasks];

      // Sort logic with custom objective ranking
      if (this.currentSort === 'priority') {
        tasksCopy.sort((a, b) => (a.priority ?? 99) - (b.priority ?? 99));
      } else if (this.currentSort === 'section') {
        tasksCopy.sort((a, b) => (a.section || '').localeCompare(b.section || ''));
      } else if (this.currentSort === 'objective') {
        const objectiveRank = { useful: 1, healthy: 2, fun: 3 };
        tasksCopy.sort((a, b) => {
          const rankA = objectiveRank[a.objective] || 99;
          const rankB = objectiveRank[b.objective] || 99;
          return rankA - rankB;
        });
      } else if (this.currentSort === 'type') {
        tasksCopy.sort((a, b) => (a.type || 'daily').localeCompare(b.type || 'daily'));
      }

      const sectionWrapper = document.createElement('div');
      const sectionHeader = document.createElement('div');
      sectionHeader.className = 'flex items-center justify-between pb-1.5 mb-2';

      const sectionTitle = document.createElement('h2');
      sectionTitle.className = 'text-[10px] font-bold uppercase tracking-wider text-slate-400';
      sectionTitle.textContent = `Sorted by ${this.currentSort}`;

      const sectionCount = document.createElement('span');
      sectionCount.className = 'text-[10px] font-medium text-slate-400';
      sectionCount.textContent = `${tasksCopy.length} ${tasksCopy.length === 1 ? 'task' : 'tasks'}`;

      sectionHeader.appendChild(sectionTitle);
      sectionHeader.appendChild(sectionCount);
      sectionWrapper.appendChild(sectionHeader);

      const ul = document.createElement('ul');
      ul.className = 'space-y-1.5';

      tasksCopy.forEach((taskItem, index) => {
        const taskName = taskItem.name;
        const taskType = taskItem.type || 'daily';
        const taskDesc = taskItem.desc || '';
        const isDisabled = !!taskItem.disabled;
        const objectiveKey = taskItem.objective || 'default';
        const sectionName = taskItem.section || 'General';

        ul.appendChild(this.createTaskListItem(taskName, taskType, taskDesc, isDisabled, objectiveKey, sectionName, index));
      });

      sectionWrapper.appendChild(ul);
      mainCard.appendChild(sectionWrapper);
    }

    createTaskListItem(taskName, taskType, taskDesc, isDisabled, objectiveKey, sectionName, index) {
      const colors = this.objectiveColors[objectiveKey] || this.objectiveColors.default;
      const id = `task-${this.id}-${index}`;
      const li = document.createElement('li');
      li.className = `flex items-start justify-between p-2 rounded-md border transition ${
        isDisabled
          ? 'opacity-50 bg-slate-50 border-slate-100 cursor-not-allowed'
          : 'bg-white border-slate-200/80 hover:border-slate-300 hover:bg-slate-50 cursor-pointer'
      }`;

      li.innerHTML = `
        <div class="flex items-start gap-2.5 w-full">
          <label for="${id}" class="relative flex items-start gap-2.5 w-full ${isDisabled ? 'cursor-not-allowed' : 'cursor-pointer'}">
            <input type="checkbox" id="${id}" data-task="${taskName}" data-type="${taskType}" ${
              isDisabled ? 'disabled' : ''
            } class="sr-only peer">
                  
            <!-- Custom colored checkbox box -->
            <div class="mt-0.5 w-3.5 h-3.5 rounded border ${colors.border} bg-white ${colors.bg} peer-checked:border-transparent flex items-center justify-center transition flex-shrink-0 ${isDisabled ? 'opacity-50' : ''}">
              <svg class="w-2.5 h-2.5 text-white opacity-0 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" d="M5 13l4 4L19 7"></path>
              </svg>
            </div>

            <div class="flex flex-col flex-grow min-w-0">
              <span class="text-xs font-medium select-none flex items-center flex-wrap gap-1 ${
                isDisabled ? 'text-slate-400 line-through' : 'text-slate-800'
              }">
                <span class="break-words">${taskName}</span>
                <span class="text-[9px] px-1.5 py-0.2 rounded font-semibold bg-slate-100 text-slate-600 border border-slate-200">${sectionName}</span>
                ${taskType === 'weekly' ? `<span class="text-[9px] px-1 py-0.2 rounded no-underline font-semibold ${colors.badge}">Weekly</span>` : ''}
                ${isDisabled ? '<span class="text-[9px] text-slate-500 bg-slate-200 px-1 py-0.2 rounded no-underline font-normal">Disabled</span>' : ''}
              </span>
              ${taskDesc ? `<span class="text-[10px] text-slate-400 mt-0.5 break-words leading-tight">${taskDesc}</span>` : ''}
            </div>
          </label>
        </div>
      `;

      const checkbox = li.querySelector('input[type="checkbox"]');
      const checkIcon = li.querySelector('svg');

      checkbox.addEventListener('change', () => {
        checkIcon.classList.toggle('opacity-0', !checkbox.checked);
        checkIcon.classList.toggle('opacity-100', checkbox.checked);
      });

      return li;
    }

    captureCurrentCheckStates() {
      const states = {};
      const checkboxes = this.wrapper.querySelectorAll('input[type="checkbox"]:not([disabled])');
      checkboxes.forEach(chk => {
        states[chk.dataset.task] = chk.checked;
      });
      return states;
    }

    restoreCheckStates(states) {
      const checkboxes = this.wrapper.querySelectorAll('input[type="checkbox"]:not([disabled])');
      checkboxes.forEach(chk => {
        const taskName = chk.dataset.task;
        if (states[taskName]) {
          chk.checked = true;
          const checkIcon = chk.parentElement.querySelector('svg');
          if (checkIcon) {
            checkIcon.classList.remove('opacity-0');
            checkIcon.classList.add('opacity-100');
          }
        }
      });
    }

    updateProgress() {
      const checkboxes = Array.from(this.wrapper.querySelectorAll('input[type="checkbox"]:not([disabled])'));
      const completed = checkboxes.filter((chk) => chk.checked).length;
      const badge = document.getElementById(`progress-badge-${this.id}`);
      if (badge) {
        badge.textContent = `${completed} / ${checkboxes.length} Completed`;
      }
    }

    attachEvents() {
      const checkboxes = this.wrapper.querySelectorAll('input[type="checkbox"]:not([disabled])');
      checkboxes.forEach((chk) => {
        chk.addEventListener('change', () => {
          this.saveState();
          this.updateProgress();
        });
      });
      this.updateProgress();
    }

    getTodayDateString() {
      const today = new Date();
      return `${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate()}`;
    }

    getWeekKey() {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() + 4 - (d.getDay() || 7));
      const yearStart = new Date(d.getFullYear(), 0, 1);
      const weekNo = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
      return `${d.getFullYear()}-W${weekNo}`;
    }

    saveState() {
      const checkboxes = this.wrapper.querySelectorAll('input[type="checkbox"]:not([disabled])');
      let existingData = {};
      const storedValue = localStorage.getItem(this.storageKey);
      if (storedValue) {
        try {
          existingData = JSON.parse(storedValue);
        } catch (e) {}
      }

      const dailyTasks = existingData.dailyTasks || {};
      const weeklyTasks = existingData.weeklyTasks || {};
      const currentDailyDate = this.getTodayDateString();
      const currentWeekKey = this.getWeekKey();

      const savedDailyDate = existingData.dailyDate;
      const savedWeekKey = existingData.weekKey;

      const activeDaily = savedDailyDate === currentDailyDate ? dailyTasks : {};
      const activeWeekly = savedWeekKey === currentWeekKey ? weeklyTasks : {};

      checkboxes.forEach((chk) => {
        const taskName = chk.dataset.task;
        const taskType = chk.dataset.type;
        if (taskType === 'weekly') {
          activeWeekly[taskName] = chk.checked;
        } else {
          activeDaily[taskName] = chk.checked;
        }
      });

      const data = {
        dailyDate: currentDailyDate,
        weekKey: currentWeekKey,
        dailyTasks: activeDaily,
        weeklyTasks: activeWeekly
      };

      localStorage.setItem(this.storageKey, JSON.stringify(data));
    }

    loadState() {
      const storedValue = localStorage.getItem(this.storageKey);
      if (!storedValue) return;

      try {
        const data = JSON.parse(storedValue);
        const today = this.getTodayDateString();
        const currentWeek = this.getWeekKey();

        const checkboxes = this.wrapper.querySelectorAll('input[type="checkbox"]:not([disabled])');
        checkboxes.forEach((chk) => {
          const taskName = chk.dataset.task;
          const taskType = chk.dataset.type;
          const checkIcon = chk.parentElement.querySelector('svg');

          if (taskType === 'weekly') {
            if (data.weekKey === currentWeek && data.weeklyTasks && data.weeklyTasks[taskName]) {
              chk.checked = true;
            }
          } else {
            if (data.dailyDate === today && data.dailyTasks && data.dailyTasks[taskName]) {
              chk.checked = true;
            }
          }

          if (chk.checked && checkIcon) {
            checkIcon.classList.remove('opacity-0');
            checkIcon.classList.add('opacity-100');
          }
        });
      } catch (e) {
        console.error('Failed to parse task localStorage state:', e);
      }
    }
}

// Instantiated with your flat array and priority sorting default:
new DailyTaskTracker([
  { name: 'Exercises', type: 'daily', priority: 0, section: 'Foundation', objective: 'healthy' },
  { name: 'Reading', type: 'daily', desc: "Try to understand how girls, social, the world work", priority: 2, section: 'Foundation', objective: 'useful' },
  { name: 'Learn songs', type: 'daily', priority: 1, section: 'Music', objective: 'useful' }
], 'Tasks Tracker');
  </script>
</body>
</html>
